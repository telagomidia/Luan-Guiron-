<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área LG</title><style>:root{--p:#f2efe9;--i:#111113;--v:#6f2cff}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:Arial;color:var(--i)}header{padding:20px 5vw;border-bottom:1px solid;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900}.logout{border:1px solid;padding:10px 16px;background:none}.wrap{width:min(1200px,90%);margin:55px auto}.hero{display:flex;justify-content:space-between;gap:30px;align-items:end}.hero h1{font-size:clamp(46px,8vw,100px);letter-spacing:-.06em;line-height:.85;margin:0}.role{color:var(--v);font-weight:800;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:50px}.card{border:1px solid;padding:24px;min-height:160px}.card h2{margin-top:0}.card p{line-height:1.5;color:#555}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero{display:block}}</style></head><body><header><div class="brand">LG · ÁREA PRIVADA</div><button class="logout" id="logout">Sair</button></header><main class="wrap"><div class="hero"><div><div class="role" id="role">Carregando...</div><h1 id="hello">SUA<br>EVOLUÇÃO.</h1></div><p id="status">Carregando seus dados…</p></div><section class="grid" id="cards"></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
const sb=supabase.createClient(LG_CONFIG.supabaseUrl,LG_CONFIG.supabaseKey);
(async()=>{const {data:{session}}=await sb.auth.getSession();if(!session){location.href='./';return}const {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();if(error||!p){document.getElementById('status').textContent='Seu perfil ainda precisa ser ativado pelo professor.';return}document.getElementById('role').textContent=p.role==='trainer'?'Professor / Administração':'Aluno';document.getElementById('hello').innerHTML='OLÁ,<br>'+p.full_name.split(' ')[0].toUpperCase()+'.';document.getElementById('status').textContent=p.role==='trainer'?'Gerencie alunos, avaliações e prescrições.':'Acompanhe seus treinos, avaliações e evolução.';const student=[['Meu treino','Prescrição, séries, repetições, RIR e histórico de cargas.'],['Avaliações','Bioimpedância, medidas, dobras, força, VO₂máx e sinais vitais.'],['Evolução','Histórico de avaliações e fotos de evolução.'],['Anamnese','Questionário de saúde e rotina.'],['Orientações','Recomendações registradas pelo professor.'],['Perfil','Seus dados de acesso e cadastro.']];const trainer=[['Alunos','Cadastros e acompanhamento individual.'],['Avaliações','Nova avaliação e histórico dos alunos.'],['Treinos','Prescrição e acompanhamento das sessões.'],['Anamneses','Respostas e histórico dos alunos.'],['Evolução','Fotos, medidas e resultados.'],['Orientações','Registre recomendações para cada aluno.']];document.getElementById('cards').innerHTML=(p.role==='trainer'?trainer:student).map(x=>'<article class="card"><h2>'+x[0]+'</h2><p>'+x[1]+'</p></article>').join('')})();document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='./'};
</script></body></html>
