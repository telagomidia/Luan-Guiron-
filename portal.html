<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área LG — Luan Guiron</title><style>
:root{--paper:#f1eee8;--ink:#11110f;--purple:#7135e8;--line:#c9c4bb;--muted:#68645e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}header{height:96px;padding:0 5vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:14px;font-weight:900;letter-spacing:.04em}.mark{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;border:1px solid #ddd;overflow:hidden}.mark img{width:100%;height:100%;object-fit:contain;padding:5px}.logout{border:1px solid var(--ink);background:transparent;padding:12px 20px;font-weight:700;cursor:pointer}.wrap{width:min(1240px,90%);margin:0 auto}.loading{min-height:calc(100vh - 97px);display:grid;grid-template-columns:1.25fr .75fr;align-items:center;gap:7vw}.eyebrow{color:var(--purple);font-size:13px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin-bottom:18px}.loading h1,.hero h1{font-size:clamp(58px,9vw,126px);line-height:.78;letter-spacing:-.075em;margin:0}.loading-copy{max-width:410px}.loading-copy h2{font-size:clamp(25px,3vw,40px);letter-spacing:-.04em;margin:0 0 14px}.loading-copy p{font-size:17px;line-height:1.6;color:var(--muted)}.bar{height:3px;background:#d5d0c7;margin-top:28px;overflow:hidden}.bar:after{content:"";display:block;height:100%;width:40%;background:var(--purple);animation:load 1.25s infinite ease-in-out}@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}#dashboard{display:none}.hero{padding:70px 0 50px;display:flex;justify-content:space-between;align-items:end;gap:30px}.hero p{max-width:390px;color:var(--muted);font-size:17px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:70px}.card{border:1px solid var(--line);padding:28px;min-height:175px;transition:.2s}.card:hover{border-color:var(--purple);transform:translateY(-2px)}.card h2{font-size:24px;margin:0 0 16px}.card p{color:var(--muted);line-height:1.5;margin:0}.error{color:#a02b2b}.photoPanel{display:none;padding:0 0 70px}.photoPanel h2{font-size:34px;margin:0 0 8px}.photoGroup{margin-top:28px}.photoGroup h3{font-size:18px;margin:0 0 12px}.photoGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.progressPhoto{margin:0;border:1px solid var(--line);background:#fff}.progressPhoto img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}.progressPhoto figcaption{padding:10px;font-size:12px;font-weight:700;text-transform:uppercase}.compareBox{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 0;margin:24px 0}.compareControls{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.compareControls label{display:grid;gap:6px;font-size:12px;font-weight:800}.compareControls select{padding:11px;background:transparent;border:1px solid var(--line)}.compareGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.compareSide{border:1px solid var(--line);background:#fff}.compareSide img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.compareSide div{padding:12px}.compareSide b{display:block}.compareSide small{color:var(--muted)}@media(max-width:760px){.photoGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){header{height:80px}.mark{width:44px;height:44px}.brand span:last-child{display:none}.loading{grid-template-columns:1fr;align-content:center;gap:45px;min-height:calc(100vh - 81px)}.loading h1,.hero h1{font-size:clamp(54px,18vw,88px)}.hero{display:block;padding-top:55px}.hero p{margin-top:30px}.grid{grid-template-columns:1fr}.card{min-height:140px}}
</style></head><body><header><div class="brand"><div class="mark"><img src="./public/logo-lg.webp" alt="LG"></div><span>LUAN GUIRON · ÁREA PRIVADA</span></div><button class="logout" id="logout">Sair</button></header>
<main class="wrap"><section class="loading" id="loading"><div><div class="eyebrow" id="loadRole">ÁREA EXCLUSIVA</div><h1>SEU<br>ESPAÇO.</h1></div><div class="loading-copy"><h2 id="loadTitle">Preparando seu painel.</h2><p id="loadText">Estamos carregando seu perfil, permissões e informações.</p><div class="bar" id="bar"></div></div></section>
<section id="dashboard"><div class="hero"><div><div class="eyebrow" id="role"></div><h1 id="hello"></h1></div><p id="status"></p></div><section class="grid" id="cards"></section><section class="photoPanel" id="photoPanel"><button class="logout" id="closePhotos" style="margin-bottom:20px">← Voltar</button><h2>Minha evolução</h2><p>Suas fotos de evolução ficam privadas e organizadas por data de avaliação.</p><div id="photoHistory"></div></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
const sb=supabase.createClient(LG_CONFIG.supabaseUrl,LG_CONFIG.supabaseKey);
const loading=document.getElementById('loading'),dashboard=document.getElementById('dashboard');
function fail(t){document.getElementById('loadTitle').textContent='Não foi possível abrir seu painel.';document.getElementById('loadText').textContent=t;document.getElementById('loadText').className='error';document.getElementById('bar').style.display='none'}
(async()=>{const {data:{session},error:se}=await sb.auth.getSession();if(se||!session){location.href='./';return}\nif((session.user.email||'').toLowerCase()==='luanguiron10@gmail.com'){location.replace('./admin.html');return}
const {data:p,error}=await sb.from('profiles').select('id,role,full_name,email,active').eq('id',session.user.id).maybeSingle();
if(error){console.error(error);fail('Houve um erro ao consultar suas permissões. Saia e entre novamente.');return}
if(!p){fail('Seu acesso existe, mas o perfil ainda não está vinculado.');return}
if(!p.active){fail('Seu perfil está inativo.');return}\nif(p.role==='trainer'){location.href='./admin.html';return}
document.getElementById('role').textContent=p.role==='trainer'?'Professor / Administração':'Aluno';
document.getElementById('hello').innerHTML='OLÁ,<br>'+((p.full_name||'').split(' ')[0]||'VOCÊ').toUpperCase()+'.';
document.getElementById('status').textContent=p.role==='trainer'?'Gerencie alunos, avaliações, prescrições e acompanhe a evolução de cada aluno.':'Acompanhe seus treinos, avaliações e evolução.';
const student=[['Meu treino','Prescrição, séries, repetições, RIR e histórico de cargas.'],['Avaliações','Bioimpedância, medidas, dobras, força, VO₂máx e sinais vitais.'],['Evolução','Histórico de avaliações e fotos de evolução.'],['Anamnese','Questionário de saúde e rotina.'],['Orientações','Recomendações registradas pelo professor.'],['Perfil','Seus dados de acesso e cadastro.']];
const trainer=[['Alunos','Cadastros e acompanhamento individual.'],['Avaliações','Nova avaliação e histórico dos alunos.'],['Treinos','Prescrição e acompanhamento das sessões.'],['Anamneses','Respostas e histórico dos alunos.'],['Evolução','Fotos, medidas e resultados.'],['Orientações','Registre recomendações para cada aluno.']];
document.getElementById('cards').innerHTML=(p.role==='trainer'?trainer:student).map(x=>'<article class="card" data-card="'+x[0]+'"><h2>'+x[0]+'</h2><p>'+x[1]+'</p></article>').join('');
async function openPhotos(){let panel=document.getElementById('photoPanel'),hist=document.getElementById('photoHistory');hist.innerHTML='<p>Carregando fotos...</p>';document.querySelector('.hero').style.display='none';document.getElementById('cards').style.display='none';panel.style.display='block';let {data:photos,error:pe}=await sb.from('progress_photos').select('id,photo_date,view,storage_path').eq('student_id',p.id).order('photo_date',{ascending:false});if(pe){hist.innerHTML='<p class="error">'+pe.message+'</p>';return}if(!photos?.length){hist.innerHTML='<p>Nenhuma foto de evolução cadastrada ainda.</p>';return}let groups={};for(const ph of photos){let {data:signed}=await sb.storage.from('progress-photos').createSignedUrl(ph.storage_path,3600);if(!groups[ph.photo_date])groups[ph.photo_date]=[];groups[ph.photo_date].push({...ph,url:signed?.signedUrl})}let names={front:'Frente',back:'Costas',right:'Perfil direito',left:'Perfil esquerdo'},dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a)),opts=dates.map(d=>'<option value="'+d+'">'+new Date(d+'T12:00:00').toLocaleDateString('pt-BR')+'</option>').join('');hist.innerHTML=(dates.length>1?'<div class="compareBox"><b>Comparar evolução</b><p>Escolha duas avaliações e o mesmo ângulo para visualizar lado a lado.</p><div class="compareControls"><label>Antes<select id="cmpA">'+opts+'</select></label><label>Depois<select id="cmpB">'+opts+'</select></label><label>Ângulo<select id="cmpView"><option value="front">Frente</option><option value="back">Costas</option><option value="right">Perfil direito</option><option value="left">Perfil esquerdo</option></select></label></div><div id="compareResult"></div></div>':'')+dates.map(date=>'<div class="photoGroup"><h3>'+new Date(date+'T12:00:00').toLocaleDateString('pt-BR')+'</h3><div class="photoGrid">'+groups[date].map(ph=>'<figure class="progressPhoto"><img src="'+ph.url+'" alt="'+(names[ph.view]||ph.view)+'"><figcaption>'+(names[ph.view]||ph.view)+'</figcaption></figure>').join('')+'</div></div>').join('');if(dates.length>1){let a=document.getElementById('cmpA'),b=document.getElementById('cmpB'),vw=document.getElementById('cmpView');a.value=dates[dates.length-1];b.value=dates[0];let draw=()=>{let pa=groups[a.value]?.find(x=>x.view===vw.value),pb=groups[b.value]?.find(x=>x.view===vw.value),r=document.getElementById('compareResult');if(!pa||!pb){r.innerHTML='<p>Esse ângulo não está disponível nas duas avaliações selecionadas.</p>';return}r.innerHTML='<div class="compareGrid"><div class="compareSide"><img src="'+pa.url+'"><div><b>ANTES</b><small>'+new Date(a.value+'T12:00:00').toLocaleDateString('pt-BR')+' · '+names[vw.value]+'</small></div></div><div class="compareSide"><img src="'+pb.url+'"><div><b>DEPOIS</b><small>'+new Date(b.value+'T12:00:00').toLocaleDateString('pt-BR')+' · '+names[vw.value]+'</small></div></div></div>'};a.onchange=b.onchange=vw.onchange=draw;draw()}}
let evo=[...document.querySelectorAll('[data-card="Evolução"]')][0];if(evo)evo.onclick=openPhotos;document.getElementById('closePhotos').onclick=()=>{document.getElementById('photoPanel').style.display='none';document.querySelector('.hero').style.display='flex';document.getElementById('cards').style.display='grid'};
loading.style.display='none';dashboard.style.display='block';
})();document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();location.href='./'};
</script></body></html>
