<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Área LG — Luan Guiron</title><style>
:root{--paper:#f1eee8;--ink:#11110f;--purple:#7135e8;--line:#c9c4bb;--muted:#68645e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}header{height:96px;padding:0 5vw;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:14px;font-weight:900;letter-spacing:.04em}.mark{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;border:1px solid #ddd;overflow:hidden}.mark img{width:100%;height:100%;object-fit:contain;padding:5px}.logout{border:1px solid var(--ink);background:transparent;padding:12px 20px;font-weight:700;cursor:pointer}.wrap{width:min(1240px,90%);margin:0 auto}.loading{min-height:calc(100vh - 97px);display:grid;grid-template-columns:1.25fr .75fr;align-items:center;gap:7vw}.eyebrow{color:var(--purple);font-size:13px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;margin-bottom:18px}.loading h1,.hero h1{font-size:clamp(58px,9vw,126px);line-height:.78;letter-spacing:-.075em;margin:0}.loading-copy{max-width:410px}.loading-copy h2{font-size:clamp(25px,3vw,40px);letter-spacing:-.04em;margin:0 0 14px}.loading-copy p{font-size:17px;line-height:1.6;color:var(--muted)}.bar{height:3px;background:#d5d0c7;margin-top:28px;overflow:hidden}.bar:after{content:"";display:block;height:100%;width:40%;background:var(--purple);animation:load 1.25s infinite ease-in-out}@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}#dashboard{display:none}.hero{padding:70px 0 50px;display:flex;justify-content:space-between;align-items:end;gap:30px}.hero p{max-width:390px;color:var(--muted);font-size:17px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:70px}.card{border:1px solid var(--line);padding:28px;min-height:175px;transition:.2s}.card:hover{border-color:var(--purple);transform:translateY(-2px)}.card h2{font-size:24px;margin:0 0 16px}.card p{color:var(--muted);line-height:1.5;margin:0}.error{color:#a02b2b}@media(max-width:760px){header{height:80px}.mark{width:44px;height:44px}.brand span:last-child{display:none}.loading{grid-template-columns:1fr;align-content:center;gap:45px;min-height:calc(100vh - 81px)}.loading h1,.hero h1{font-size:clamp(54px,18vw,88px)}.hero{display:block;padding-top:55px}.hero p{margin-top:30px}.grid{grid-template-columns:1fr}.card{min-height:140px}}
</style></head><body><header><div class="brand"><div class="mark"><img src="./public/logo-lg.webp" alt="LG"></div><span>LUAN GUIRON · ÁREA PRIVADA</span></div><button class="logout" id="logout">Sair</button></header>
<main class="wrap"><section class="loading" id="loading"><div><div class="eyebrow" id="loadRole">ÁREA EXCLUSIVA</div><h1>SEU<br>ESPAÇO.</h1></div><div class="loading-copy"><h2 id="loadTitle">Preparando seu painel.</h2><p id="loadText">Estamos carregando seu perfil, permissões e informações.</p><div class="bar" id="bar"></div></div></section>
<section id="dashboard"><div class="hero"><div><div class="eyebrow" id="role"></div><h1 id="hello"></h1></div><p id="status"></p></div><section class="grid" id="cards"></section></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
const sb=supabase.createClient(LG_CONFIG.supabaseUrl,LG_CONFIG.supabaseKey);
const loading=document.getElementById('loading'),dashboard=document.getElementById('dashboard');
function fail(t){document.getElementById('loadTitle').textContent='Não foi possível abrir seu painel.';document.getElementById('loadText').textContent=t;document.getElementById('loadText').className='error';document.getElementById('bar').style.display='none'}
(async()=>{const {data:{session},error:se}=await sb.auth.getSession();if(se||!session){location.href='./';return}\nif((session.user.email||'').toLowerCase()==='luanguiron10@gmail.com'){location.replace('./admin.html');return}
const {data:p,error}=await sb.from('profiles').select('id,role,full_name,email,active').eq('id',session.user.id).maybeSingle();
if(error){console.error(error);fail('Houve um erro ao consultar suas permissões. Saia e entre novamente.');return}
if(!p){fail('Seu acesso existe, mas o perfil ainda não está vinculado.');return}
if(!p.active){fail('Seu perfil está inativo.');return}\nif(p.role==='trainer'){location.href='./admin.html';return}
document.getElementById('role').textContent=p.role==='trainer'?'Professor / Administração':'Aluno';
document.getElementById('hello').innerHTML='OLÁ,<br>'+((p.full_name||'').split(' ')[0]||'VOCÊ').toUpperCase()+'.';
document.getElementById('status').textContent=p.role==='trainer'?'Gerencie alunos, avaliações, prescrições e acompanhe a evolução de cada aluno.':'Acompanhe seus treinos, avaliações e evolução.';
const student=[['Meu treino','Prescrição, séries, repetições, RIR e histórico de cargas.'],['Avaliações','Bioimpedância, medidas, dobras, força, VO₂máx e sinais vitais.'],['Evolução','Histórico de avaliações e fotos de evolução.'],['Anamnese','Questionário de saúde e rotina.'],['Orientações','Recomendações registradas pelo professor.'],['Perfil','Seus dados de acesso e cadastro.']];
const trainer=[['Alunos','Cadastros e acompanhamento individual.'],['Avaliações','Nova avaliação e histórico dos alunos.'],['Treinos','Prescrição e acompanhamento das sessões.'],['Anamneses','Respostas e histórico dos alunos.'],['Evolução','Fotos, medidas e resultados.'],['Orientações','Registre recomendações para cada aluno.']];
document.getElementById('cards').innerHTML=(p.role==='trainer'?trainer:student).map(x=>'<article class="card"><h2>'+x[0]+'</h2><p>'+x[1]+'</p></article>').join('');
loading.style.display='none';dashboard.style.display='block';
})().catch(e=>{console.error(e);fail(e?.message||'Erro inesperado ao abrir o painel.')});async function logoutUser(){const b=document.getElementById('logout');if(b){b.disabled=true;b.textContent='Saindo...'}try{await sb.auth.signOut()}catch(e){console.error(e)}finally{location.replace('./index.html')}}document.getElementById('logout').onclick=logoutUser;
</script></body></html>
