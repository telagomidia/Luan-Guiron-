<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativar acesso — Luan Guiron</title><style>:root{--paper:#f2efe9;--ink:#111113;--purple:#6f2cff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center}.wrap{width:min(560px,calc(100% - 32px));border:1px solid;padding:clamp(26px,6vw,52px)}.eyebrow{color:var(--purple);font-weight:800;letter-spacing:.12em;font-size:12px}.logo{font-size:20px;font-weight:900;margin-bottom:55px}h1{font-size:clamp(45px,10vw,76px);letter-spacing:-.065em;line-height:.85;margin:12px 0 24px}p{line-height:1.6;color:#555}label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:22px 0 7px}input{width:100%;padding:15px;border:1px solid;background:#fff;font-size:16px}button{width:100%;margin-top:26px;padding:16px;border:0;background:var(--ink);color:#fff;font-weight:800;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}button:disabled{opacity:.5}.msg{min-height:24px;margin-top:18px;font-size:14px}.ok{color:#257a3e}.err{color:#a52a2a}.email{font-weight:800;color:var(--ink)}</style></head><body><main class="wrap"><div class="logo">LG · ÁREA PRIVADA</div><div class="eyebrow">PRIMEIRO ACESSO</div><h1>ATIVE<br>SEU ACESSO.</h1><p>Conta administrativa reservada para <span class="email">Luanguiron10@gmail.com</span>. Crie sua senha abaixo. Depois, confirme seu e-mail pela mensagem enviada pelo sistema.</p><form id="form"><label>Crie sua senha</label><input id="pass" type="password" minlength="8" required autocomplete="new-password"><label>Confirme sua senha</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"><button id="submit">Criar acesso de administrador</button><div id="msg" class="msg"></div></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
const sb=supabase.createClient(LG_CONFIG.supabaseUrl,LG_CONFIG.supabaseKey),email='Luanguiron10@gmail.com',form=document.getElementById('form'),msg=document.getElementById('msg'),btn=document.getElementById('submit');
async function claim(){const {data:{session}}=await sb.auth.getSession();if(!session)return false;const {error}=await sb.rpc('claim_admin_profile');if(error){msg.className='msg err';msg.textContent='Não foi possível ativar o perfil administrativo.';return true}location.href='./portal.html';return true}
claim();
form.onsubmit=async e=>{e.preventDefault();const p=document.getElementById('pass').value,c=document.getElementById('confirm').value;if(p!==c){msg.className='msg err';msg.textContent='As senhas não são iguais.';return}btn.disabled=true;msg.className='msg';msg.textContent='Criando seu acesso…';const {data,error}=await sb.auth.signUp({email,password:p,options:{emailRedirectTo:location.href.split('#')[0]}});if(error){btn.disabled=false;msg.className='msg err';msg.textContent=error.message;return}if(data.session){await claim();return}msg.className='msg ok';msg.textContent='Conta criada. Abra o e-mail de confirmação enviado para '+email+'. Depois de confirmar, você voltará para concluir a ativação.';btn.disabled=false};
</script></body></html>
