name: Regression tests
on:
  pull_request:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tests/*.test.cjs
      - name: Student portal DOM integration
        run: |
          npm install --prefix "$RUNNER_TEMP/portal-ui" happy-dom@20.14.5 --no-audit --no-fund
          HAPPY_DOM_ENTRY="$RUNNER_TEMP/portal-ui/node_modules/happy-dom/lib/index.js" node tests/portal-ui.check.mjs
          HAPPY_DOM_ENTRY="$RUNNER_TEMP/portal-ui/node_modules/happy-dom/lib/index.js" node tests/dashboard-ui.check.mjs
          HAPPY_DOM_ENTRY="$RUNNER_TEMP/portal-ui/node_modules/happy-dom/lib/index.js" node tests/onboarding-ui.check.mjs
          HAPPY_DOM_ENTRY="$RUNNER_TEMP/portal-ui/node_modules/happy-dom/lib/index.js" node tests/anamnesis-ui.check.mjs
          HAPPY_DOM_ENTRY="$RUNNER_TEMP/portal-ui/node_modules/happy-dom/lib/index.js" node tests/admin-anamnesis-ui.check.mjs
      - name: Mobile and desktop Chromium layout
        run: |
          npm install --prefix "$RUNNER_TEMP/mobile-ui" playwright@1.58.2 --no-audit --no-fund
          node "$RUNNER_TEMP/mobile-ui/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_ENTRY="$RUNNER_TEMP/mobile-ui/node_modules/playwright/index.mjs" MOBILE_SCREENSHOTS="$RUNNER_TEMP/mobile-layout-screenshots" node tests/responsive-browser.check.mjs
          PLAYWRIGHT_ENTRY="$RUNNER_TEMP/mobile-ui/node_modules/playwright/index.mjs" node tests/backup-browser.check.mjs
          PLAYWRIGHT_ENTRY="$RUNNER_TEMP/mobile-ui/node_modules/playwright/index.mjs" node tests/onboarding-browser.check.mjs
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          PLAYWRIGHT_ENTRY="$RUNNER_TEMP/mobile-ui/node_modules/playwright/index.mjs" MOBILE_SCREENSHOTS="$RUNNER_TEMP/mobile-layout-screenshots" node tests/anamnesis-browser.check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-layout-screenshots
          path: ${{ runner.temp }}/mobile-layout-screenshots
          if-no-files-found: ignore
