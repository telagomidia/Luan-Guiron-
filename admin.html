<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LG Gestão</title><style>
:root{--bg:#12100b;--panel:#18150f;--paper:#f0ede7;--muted:#a9a49c;--line:#39352d;--p:#c784ff;--danger:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:15px Arial,sans-serif}button,input,select,textarea{font:inherit}header{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:sticky;top:0;background:rgba(18,16,11,.96);z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.logo{width:44px;height:44px;border-radius:50%;background:#fff;padding:4px;object-fit:contain}.out,.ghost{background:none;color:var(--paper);border:1px solid var(--line);padding:10px 15px;cursor:pointer}.shell{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 82px)}aside{border-right:1px solid var(--line);padding:30px 18px}.nav{display:grid;gap:7px}.nav button{border:0;background:none;color:var(--muted);text-align:left;padding:13px;border-radius:8px;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:#211c16;color:var(--paper)}main{padding:42px 4vw 80px;max-width:1400px}.ey{color:var(--p);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(42px,6vw,76px);letter-spacing:-.06em;line-height:.9;margin:10px 0 15px}h2{font-size:28px;letter-spacing:-.03em}.muted{color:var(--muted);line-height:1.6}.stats,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}.stat,.card{border:1px solid var(--line);padding:22px;background:var(--panel)}.stat strong{font-size:38px;display:block}.card{cursor:pointer;min-height:150px}.card:hover{border-color:var(--p)}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:28px 0 15px}.primary{background:var(--paper);color:#111;border:0;padding:12px 17px;font-weight:800;cursor:pointer}.list{display:grid;gap:9px}.row{border:1px solid var(--line);padding:17px;display:flex;justify-content:space-between;gap:15px;align-items:center}.row b{display:block;margin-bottom:5px}.row small{color:var(--muted)}.empty{border:1px dashed var(--line);padding:35px;text-align:center;color:var(--muted)}dialog{width:min(650px,92vw);border:1px solid var(--line);background:#17140f;color:var(--paper);padding:0}dialog::backdrop{background:#000a}.modal{padding:28px}.modalhead{display:flex;justify-content:space-between;align-items:center}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}input,select,textarea{width:100%;padding:12px;background:#0e0d09;border:1px solid var(--line);color:var(--paper)}textarea{min-height:95px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.toast{position:fixed;right:25px;bottom:25px;background:var(--paper);color:#111;padding:14px 18px;display:none;z-index:10}.bad{color:var(--danger)}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:10px;overflow:auto}.nav{display:flex;min-width:max-content}.nav button{padding:11px}.stats,.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}main{padding-top:30px}.brand span{display:none}}
.assessment-tabs{display:flex;gap:7px;overflow-x:auto;margin:18px 0 22px;padding-bottom:8px}.atab{white-space:nowrap;border:1px solid var(--line);background:#0e0d09;color:var(--muted);padding:10px 12px;cursor:pointer}.atab.active{background:var(--paper);color:#111;border-color:var(--paper)}.astep{display:none}.astep.active{display:block}dialog:has(.assessment-tabs){width:min(820px,94vw);max-height:90vh;overflow:auto}@media(max-width:800px){dialog:has(.assessment-tabs){width:96vw}.assessment-tabs{margin-left:-8px;margin-right:-8px}.atab{font-size:12px}}
</style></head><body><header><div class="brand"><img class="logo" src="./public/logo-lg.webp"><span>LUAN GUIRON · GESTÃO</span></div><button class="out" id="logout">Sair</button></header><div class="shell"><aside><nav class="nav" id="nav"></nav></aside><main id="view"><div class="ey">Carregando</div><h1>SEU PAINEL.</h1></main></div><dialog id="modal"><div class="modal"><div class="modalhead"><h2 id="mt">Novo</h2><button class="ghost" onclick="modal.close()">Fechar</button></div><form id="form"></form></div></dialog><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
const sb=supabase.createClient(LG_CONFIG.supabaseUrl,LG_CONFIG.supabaseKey),view=document.querySelector('#view'),nav=document.querySelector('#nav'),modal=document.querySelector('#modal'),form=document.querySelector('#form');let me=null,students=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){let x=document.querySelector('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='./';let {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error||!p)return view.innerHTML='<h2 class="bad">Não foi possível carregar seu perfil.</h2>';me=p;if(p.role!=='trainer')return location.href='./portal.html';nav.innerHTML=['Dashboard','Alunos','Avaliações','Treinos','Anamneses','Evolução','Orientações'].map((x,i)=>'<button data-page="'+x+'" class="'+(!i?'active':'')+'">'+x+'</button>').join('');nav.onclick=e=>{if(e.target.dataset.page)go(e.target.dataset.page)};go('Dashboard')}
async function loadStudents(){let {data,error}=await sb.from('profiles').select('*').eq('role','student').order('full_name');if(error)throw error;students=data||[];return students}
function studentOptions(){return students.map(s=>'<option value="'+s.id+'">'+esc(s.full_name)+'</option>').join('')}
async function go(page){[...nav.children].forEach(b=>b.classList.toggle('active',b.dataset.page===page));view.innerHTML='<div class="ey">'+esc(page)+'</div><h1>CARREGANDO.</h1>';try{if(page==='Dashboard')return dashboard();if(page==='Alunos')return alunos();if(page==='Avaliações')return avaliacoes();if(page==='Treinos')return treinos();if(page==='Anamneses')return generic('Anamneses','anamneses','answers');if(page==='Evolução')return evolucao();if(page==='Orientações')return orientacoes()}catch(e){console.error(e);view.innerHTML='<h2 class="bad">Erro ao carregar.</h2><p class="muted">'+esc(e.message)+'</p>'}}
async function dashboard(){await loadStudents();let [{count:a},{count:w},{count:s}]=await Promise.all([sb.from('assessments').select('*',{count:'exact',head:true}),sb.from('training_plans').select('*',{count:'exact',head:true}),sb.from('workout_sessions').select('*',{count:'exact',head:true})]);view.innerHTML='<div class="ey">Professor / Administração</div><h1>OLÁ,<br>'+esc(me.full_name.split(' ')[0].toUpperCase())+'.</h1><p class="muted">Gestão central dos seus alunos, avaliações e prescrições.</p><div class="stats"><div class="stat"><strong>'+students.length+'</strong>alunos cadastrados</div><div class="stat"><strong>'+(a||0)+'</strong>avaliações</div><div class="stat"><strong>'+(s||0)+'</strong>sessões registradas</div></div><div class="cards">'+['Alunos','Avaliações','Treinos','Anamneses','Evolução','Orientações'].map(x=>'<div class="card" onclick="go(\''+x+'\')"><h2>'+x+'</h2><p class="muted">Abrir módulo →</p></div>').join('')+'</div>'}
async function alunos(){await loadStudents();view.innerHTML='<div class="ey">Gestão de alunos</div><h1>ALUNOS.</h1><div class="toolbar"><p class="muted">'+students.length+' cadastro(s)</p><button class="primary" onclick="studentForm()">+ Novo aluno</button></div><div class="list">'+(students.length?students.map(s=>'<div class="row"><div><b>'+esc(s.full_name)+'</b><small>'+esc(s.email||'Sem e-mail')+' · '+esc(s.goal||'Objetivo não informado')+'</small></div><button class="ghost" onclick="studentForm(\''+s.id+'\')">Editar</button></div>').join(''):'<div class="empty">Nenhum aluno cadastrado ainda.</div>')+'</div>'}
function studentForm(id){let s=students.find(x=>x.id===id)||{};document.querySelector('#mt').textContent=id?'Editar aluno':'Novo aluno';form.innerHTML='<div class="form"><div class="field"><label>Nome</label><input name="full_name" value="'+esc(s.full_name)+'" required></div><div class="field"><label>E-mail</label><input name="email" type="email" value="'+esc(s.email)+'" required></div><div class="field"><label>Telefone</label><input name="phone" value="'+esc(s.phone)+'"></div><div class="field"><label>Nascimento</label><input name="birth_date" type="date" value="'+esc(s.birth_date)+'"></div><div class="field"><label>Início</label><input name="starts_on" type="date" value="'+esc(s.start_date)+'"></div><div class="field"><label>Objetivo</label><input name="goal" value="'+esc(s.goal)+'"></div><div class="field full"><label>Observações</label><textarea name="observations">'+esc(s.observations)+'</textarea></div></div><div class="actions"><button type="button" class="ghost" onclick="modal.close()">Cancelar</button><button class="primary" id="saveStudent">Salvar</button></div>';form.onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#saveStudent');btn.disabled=true;btn.textContent='Salvando...';let v=Object.fromEntries(new FormData(form));Object.keys(v).forEach(k=>v[k]===''&&delete v[k]);try{if(!id){const {data,error}=await sb.functions.invoke('create-student',{body:v});if(error)throw error;if(data?.error)throw new Error(data.error);modal.close();toast('Aluno cadastrado com sucesso');return alunos()}const update={full_name:v.full_name,email:v.email,phone:v.phone||null,birth_date:v.birth_date||null,sex:v.sex||null,start_date:v.starts_on||null,goal:v.goal||null,observations:v.observations||null};let {error}=await sb.from('profiles').update(update).eq('id',id);if(error)throw error;modal.close();toast('Aluno atualizado');alunos()}catch(err){console.error(err);toast('Erro: '+(err.message||'não foi possível salvar'));btn.disabled=false;btn.textContent='Salvar'}};modal.showModal()}
async function avaliacoes(){await loadStudents();let {data,error}=await sb.from('assessments').select('*').order('assessed_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Avaliação física</div><h1>AVALIAÇÕES.</h1><div class="toolbar"><p class="muted">Avaliação completa: sinais vitais, composição corporal, perimetria, dobras, força e capacidade cardiorrespiratória.</p><button class="primary" onclick="assessmentForm()">+ Nova avaliação</button></div><div class="list">'+((data||[]).map(a=>'<div class="row"><div><b>'+esc(students.find(s=>s.id===a.student_id)?.full_name||'Aluno')+'</b><small>'+esc(a.assessed_at)+' · '+esc(a.protocol||'Avaliação física')+'</small></div></div>').join('')||'<div class="empty">Nenhuma avaliação registrada.</div>')+'</div>'}

function assessmentForm(){if(!students.length)return toast('Cadastre um aluno primeiro');document.querySelector('#mt').textContent='Nova avaliação';const fld=(n,l,t='number',step='.1',extra='')=>'<div class="field"><label>'+l+'</label><input name="'+n+'" type="'+t+'" '+(t==='number'?'step="'+step+'"':'')+' '+extra+'></div>';form.innerHTML='<div class="assessment-tabs"><button type="button" class="atab active" data-tab="geral">1. Geral</button><button type="button" class="atab" data-tab="comp">2. Composição</button><button type="button" class="atab" data-tab="peri">3. Perimetria</button><button type="button" class="atab" data-tab="forca">4. Força</button><button type="button" class="atab" data-tab="vo2">5. VO₂</button><button type="button" class="atab" data-tab="docs">6. Fotos</button></div>'+
'<section class="astep active" data-step="geral"><div class="form"><div class="field full"><label>Aluno</label><select name="student_id">'+studentOptions()+'</select></div>'+fld('assessed_at','Data','date','.1','required')+fld('weight_kg','Peso (kg)')+fld('height_cm','Altura (cm)')+'<div class="field"><label>IMC (automático)</label><input name="bmi_preview" readonly placeholder="Calculado ao preencher peso e altura"></div>'+fld('systolic_bp','Pressão sistólica','number','1')+fld('diastolic_bp','Pressão diastólica','number','1')+fld('resting_hr','FC repouso (bpm)','number','1')+fld('spo2','SpO₂ (%)','number','1')+fld('temperature_c','Temperatura (°C)')+'<div class="field full"><label>Observações gerais</label><textarea name="notes"></textarea></div></div></section>'+
'<section class="astep" data-step="comp"><div class="form"><div class="field full"><label>Tipo de avaliação da composição corporal</label><select name="composition_method" id="compositionMethod"><option value="">Selecione</option><option value="bioimpedance">Bioimpedância</option><option value="skinfolds">Dobras cutâneas</option></select></div></div><div id="bioBox" style="display:none;margin-top:16px"><div class="field full"><label>Relatório da bioimpedância (PDF)</label><input name="bioimpedance_pdf" type="file" accept="application/pdf"><small class="muted">PDF de até 10 MB. O arquivo ficará protegido no perfil do aluno.</small></div></div><div id="skinBox" style="display:none;margin-top:16px"><p class="muted">Informe as dobras em milímetros. O protocolo Guedes (1994) é aplicado automaticamente para alunos de 18 a 30 anos, conforme sexo e idade cadastrados.</p><div class="form">'+[['triceps','Tríceps'],['subscapular','Subescapular'],['biceps','Bíceps'],['chest','Peitoral'],['midaxillary','Axilar média'],['suprailiac','Supra-ilíaca'],['abdominal','Abdominal'],['thigh','Coxa'],['calf','Panturrilha']].map(x=>fld('skin_'+x[0],x[1])).join('')+'<div class="field"><label>Densidade corporal (automática)</label><input name="body_density_preview" readonly></div><div class="field"><label>Gordura corporal % (automática)</label><input name="body_fat_preview" readonly></div><div class="field"><label>Massa gorda kg (automática)</label><input name="fat_mass_preview" readonly></div><div class="field"><label>Massa magra kg (automática)</label><input name="lean_mass_preview" readonly></div><div class="field full"><label>Protocolo</label><input name="protocol_preview" readonly></div></div></div></section>'+'<section class="astep" data-step="peri"><p class="muted">Circunferências em centímetros.</p><div class="form">'+[['neck','Pescoço'],['chest','Tórax'],['waist','Cintura'],['abdomen','Abdômen'],['hip','Quadril'],['arm_right','Braço direito'],['arm_left','Braço esquerdo'],['forearm_right','Antebraço direito'],['forearm_left','Antebraço esquerdo'],['thigh_right','Coxa direita'],['thigh_left','Coxa esquerda'],['calf_right','Panturrilha direita'],['calf_left','Panturrilha esquerda']].map(x=>fld('circ_'+x[0],x[1])).join('')+'</div></section>'+
'<section class="astep" data-step="forca"><p class="muted">Registre uma medição de dinamometria nesta avaliação. Outras medições poderão ser adicionadas depois.</p><div class="form"><div class="field"><label>Grupo muscular / teste</label><input name="strength_muscle_group"></div><div class="field"><label>Lado</label><select name="strength_side"><option value="">Selecione</option><option value="right">Direito</option><option value="left">Esquerdo</option><option value="bilateral">Bilateral</option></select></div>'+fld('strength_attempt','Tentativa','number','1')+fld('strength_force_kgf','Força (kgf)')+'<div class="field full"><label>Equipamento</label><input name="strength_device" placeholder="Dinamômetro"></div></div></section>'+
'<section class="astep" data-step="vo2"><div class="form"><div class="field full"><label>Protocolo cardiorrespiratório</label><input name="vo2_protocol"></div>'+fld('vo2_duration_seconds','Duração (segundos)','number','1')+fld('vo2_speed_kmh','Velocidade (km/h)')+fld('vo2_incline_pct','Inclinação (%)')+fld('vo2max_ml_kg_min','VO₂máx (ml/kg/min)')+fld('vo2_max_hr','FC máxima (bpm)','number','1')+'<div class="field full"><label>Observações do teste</label><textarea name="vo2_notes"></textarea></div></div></section>'+
'<section class="astep" data-step="docs"><div class="empty">Fotos de evolução e PDF da bioimpedância ficam vinculados à avaliação. O upload será habilitado nesta área em uma próxima etapa; os demais dados desta avaliação já podem ser salvos agora.</div></section>'+
'<div class="actions"><button type="button" class="ghost" onclick="modal.close()">Cancelar</button><button class="primary" id="saveAssessment">Salvar avaliação completa</button></div>';
form.querySelectorAll('.atab').forEach(b=>b.onclick=()=>{form.querySelectorAll('.atab,.astep').forEach(x=>x.classList.remove('active'));b.classList.add('active');form.querySelector('[data-step="'+b.dataset.tab+'"]').classList.add('active')});
const compSel=form.querySelector('#compositionMethod'),bioBox=form.querySelector('#bioBox'),skinBox=form.querySelector('#skinBox');
compSel.onchange=()=>{bioBox.style.display=compSel.value==='bioimpedance'?'block':'none';skinBox.style.display=compSel.value==='skinfolds'?'block':'none';calcSkin()};
const ageAtAssessment=()=>{let sid=form.elements.student_id.value,s=students.find(x=>x.id===sid),d=form.elements.assessed_at.value;if(!s?.birth_date||!d)return null;let b=new Date(s.birth_date+'T12:00:00'),a=new Date(d+'T12:00:00'),age=a.getFullYear()-b.getFullYear();if(a.getMonth()<b.getMonth()||(a.getMonth()===b.getMonth()&&a.getDate()<b.getDate()))age--;return age};
const calcSkin=()=>{if(compSel.value!=='skinfolds')return;let s=students.find(x=>x.id===form.elements.student_id.value),age=ageAtAssessment(),n=x=>parseFloat(form.elements['skin_'+x]?.value);let dc=null,proto='';if(age!==null&&age>=18&&age<=30&&s?.sex==='female'&&[n('subscapular'),n('suprailiac'),n('thigh')].every(Number.isFinite)){dc=1.1665-.0706*Math.log10(n('subscapular')+n('suprailiac')+n('thigh'));proto='Guedes 1994 — mulheres 18–30: SB + SI + CX'}else if(age!==null&&age>=18&&age<=30&&s?.sex==='male'&&[n('triceps'),n('suprailiac'),n('abdominal')].every(Number.isFinite)){dc=1.1714-.0671*Math.log10(n('triceps')+n('suprailiac')+n('abdominal'));proto='Guedes 1994 — homens 18–30: TR + SI + AB'}else{proto=!s?.sex?'Cadastre o sexo biológico do aluno para calcular':age===null?'Cadastre nascimento e data da avaliação':age<18||age>30?'Guedes 1994 desta configuração é válido para 18–30 anos':'Preencha as 3 dobras exigidas pelo protocolo'}let pct=dc?(495/dc-450):null,w=parseFloat(form.elements.weight_kg.value);form.elements.body_density_preview.value=dc?dc.toFixed(4):'';form.elements.body_fat_preview.value=pct?pct.toFixed(2):'';form.elements.fat_mass_preview.value=pct&&w?(w*pct/100).toFixed(2):'';form.elements.lean_mass_preview.value=pct&&w?(w*(1-pct/100)).toFixed(2):'';form.elements.protocol_preview.value=proto};
form.querySelectorAll('[name^="skin_"]').forEach(x=>x.oninput=calcSkin);form.elements.student_id.onchange=calcSkin;form.elements.assessed_at.onchange=calcSkin;
const calc=()=>{let w=parseFloat(form.elements.weight_kg.value),h=parseFloat(form.elements.height_cm.value)/100;form.elements.bmi_preview.value=w&&h?(w/(h*h)).toFixed(1):''};form.elements.weight_kg.oninput=()=>{calc();calcSkin()};form.elements.height_cm.oninput=calc;
form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector('#saveAssessment');btn.disabled=true;btn.textContent='Salvando...';const pdfFile=form.elements.bioimpedance_pdf?.files?.[0];let v=Object.fromEntries(new FormData(form));const take=p=>{let o={};Object.keys(v).filter(k=>k.startsWith(p)&&v[k]!=='').forEach(k=>o[k.slice(p.length)]=v[k]);return o};const circ=take('circ_'),skin=take('skin_'),strength=take('strength_'),vo2=take('vo2_');['bmi_preview','bioimpedance_pdf','body_density_preview','body_fat_preview','fat_mass_preview','lean_mass_preview','protocol_preview',...Object.keys(v).filter(k=>/^(circ_|skin_|strength_|vo2_)/.test(k))].forEach(k=>delete v[k]);if(v.composition_method==='skinfolds'){let dc=parseFloat(form.elements.body_density_preview.value),bf=parseFloat(form.elements.body_fat_preview.value),fm=parseFloat(form.elements.fat_mass_preview.value),lm=parseFloat(form.elements.lean_mass_preview.value);if(dc)v.body_density=dc;if(bf)v.body_fat_pct=bf;if(fm)v.fat_mass_kg=fm;if(lm)v.lean_mass_kg=lm;v.protocol=form.elements.protocol_preview.value||'Dobras cutâneas'}else if(v.composition_method==='bioimpedance'){v.protocol='Bioimpedância'}Object.keys(v).forEach(k=>v[k]===''&&delete v[k]);v.created_by=me.id;try{let {data:a,error}=await sb.from('assessments').insert(v).select().single();if(error)throw error;if(v.composition_method==='bioimpedance'&&pdfFile){if(pdfFile.type!=='application/pdf')throw new Error('O relatório precisa ser um PDF');if(pdfFile.size>10485760)throw new Error('O PDF deve ter no máximo 10 MB');const path=v.student_id+'/'+a.id+'/bioimpedancia.pdf';let {error:upErr}=await sb.storage.from('assessment-documents').upload(path,pdfFile,{contentType:'application/pdf',upsert:true});if(upErr)throw upErr;let {error:pathErr}=await sb.from('assessments').update({bioimpedance_pdf_path:path}).eq('id',a.id);if(pathErr)throw pathErr}const jobs=[];if(Object.keys(circ).length)jobs.push(sb.from('circumferences').insert({assessment_id:a.id,...circ}));if(Object.keys(skin).length)jobs.push(sb.from('skinfolds').insert({assessment_id:a.id,...skin}));if(strength.muscle_group&&strength.force_kgf)jobs.push(sb.from('strength_tests').insert({assessment_id:a.id,muscle_group:strength.muscle_group,side:strength.side||null,attempt:strength.attempt||1,force_kgf:strength.force_kgf,device:strength.device||'dynamometer'}));if(Object.values(vo2).some(Boolean))jobs.push(sb.from('vo2_tests').insert({assessment_id:a.id,protocol:vo2.protocol||null,duration_seconds:vo2.duration_seconds||null,speed_kmh:vo2.speed_kmh||null,incline_pct:vo2.incline_pct||null,vo2max_ml_kg_min:vo2max_ml_kg_min||null,max_hr:vo2.max_hr||null,notes:vo2.notes||null}));let rs=await Promise.all(jobs);let suberr=rs.find(x=>x.error)?.error;if(suberr)throw suberr;modal.close();toast('Avaliação completa salva');avaliacoes()}catch(err){console.error(err);toast('Erro: '+(err.message||'não foi possível salvar'));btn.disabled=false;btn.textContent='Salvar avaliação completa'}};modal.showModal()}

async function treinos(){await loadStudents();let {data,error}=await sb.from('training_plans').select('*').order('created_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Prescrição</div><h1>TREINOS.</h1><div class="toolbar"><p class="muted">Planos individualizados por aluno.</p><button class="primary" onclick="planForm()">+ Novo plano</button></div><div class="list">'+((data||[]).map(x=>'<div class="row"><div><b>'+esc(x.name)+'</b><small>'+esc(students.find(s=>s.id===x.student_id)?.full_name||'Aluno')+'</small></div></div>').join('')||'<div class="empty">Nenhum plano de treino cadastrado.</div>')+'</div>'}
function planForm(){if(!students.length)return toast('Cadastre um aluno primeiro');document.querySelector('#mt').textContent='Novo plano';form.innerHTML='<div class="form"><div class="field full"><label>Aluno</label><select name="student_id">'+studentOptions()+'</select></div><div class="field full"><label>Nome do plano</label><input name="name" placeholder="Ex.: Hipertrofia ABC" required></div><div class="field"><label>Início</label><input name="starts_on" type="date"></div><div class="field"><label>Fim</label><input name="ends_on" type="date"></div><div class="field full"><label>Observações</label><textarea name="notes"></textarea></div></div><div class="actions"><button class="primary">Criar plano</button></div>';form.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(form));Object.keys(v).forEach(k=>v[k]===''&&delete v[k]);v.created_by=me.id;let {error}=await sb.from('training_plans').insert(v);if(error)return toast(error.message);modal.close();toast('Plano criado');treinos()};modal.showModal()}
async function generic(title,table){await loadStudents();let {data,error}=await sb.from(table).select('*').order('created_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Acompanhamento</div><h1>'+title.toUpperCase()+'.</h1><p class="muted">Histórico centralizado dos seus alunos.</p><div class="list">'+((data||[]).map(x=>'<div class="row"><div><b>'+esc(students.find(s=>s.id===x.student_id)?.full_name||'Aluno')+'</b><small>'+esc(x.submitted_at||x.updated_at||'')+'</small></div></div>').join('')||'<div class="empty">Nenhum registro ainda.</div>')+'</div>'}
async function evolucao(){await loadStudents();let {data,error}=await sb.from('progress_photos').select('*').order('taken_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Acompanhamento visual</div><h1>EVOLUÇÃO.</h1><p class="muted">Fotos e registros permanecem privados e vinculados a cada aluno.</p><div class="list">'+((data||[]).map(x=>'<div class="row"><div><b>'+esc(students.find(s=>s.id===x.student_id)?.full_name||'Aluno')+'</b><small>'+esc(x.photo_date||'')+'</small></div></div>').join('')||'<div class="empty">Nenhuma foto de evolução registrada.</div>')+'</div>'}
async function orientacoes(){await loadStudents();let {data,error}=await sb.from('guidance').select('*').order('created_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Recomendações</div><h1>ORIENTAÇÕES.</h1><div class="toolbar"><p class="muted">Orientações individuais registradas no histórico.</p><button class="primary" onclick="guideForm()">+ Nova orientação</button></div><div class="list">'+((data||[]).map(x=>'<div class="row"><div><b>'+esc(x.title||'Orientação')+'</b><small>'+esc(students.find(s=>s.id===x.student_id)?.full_name||'Aluno')+'</small></div></div>').join('')||'<div class="empty">Nenhuma orientação registrada.</div>')+'</div>'}
function guideForm(){if(!students.length)return toast('Cadastre um aluno primeiro');document.querySelector('#mt').textContent='Nova orientação';form.innerHTML='<div class="form"><div class="field full"><label>Aluno</label><select name="student_id">'+studentOptions()+'</select></div><div class="field full"><label>Título</label><input name="title" required></div><div class="field full"><label>Orientação</label><textarea name="body" required></textarea></div></div><div class="actions"><button class="primary">Salvar</button></div>';form.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(form));v.created_by=me.id;let {error}=await sb.from('guidance').insert(v);if(error)return toast(error.message);modal.close();toast('Orientação salva');orientacoes()};modal.showModal()}
document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();location.href='./'};boot();
</script></body></html>
