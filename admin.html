<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LG Gestão</title><link rel="icon" type="image/svg+xml" href="./public/logo-lg-official.svg"><style>
:root{--bg:#12100b;--panel:#18150f;--paper:#f0ede7;--muted:#a9a49c;--line:#39352d;--p:#c784ff;--danger:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:15px Arial,sans-serif}button,input,select,textarea{font:inherit}header{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:sticky;top:0;background:rgba(18,16,11,.96);z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.logo{width:44px;height:44px;border-radius:50%;background:#fff;padding:4px;object-fit:contain}.out,.ghost{background:none;color:var(--paper);border:1px solid var(--line);padding:10px 15px;cursor:pointer}.shell{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 82px)}aside{border-right:1px solid var(--line);padding:30px 18px}.nav{display:grid;gap:7px}.nav button{border:0;background:none;color:var(--muted);text-align:left;padding:13px;border-radius:8px;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:#211c16;color:var(--paper)}main{padding:42px 4vw 80px;max-width:1400px}.ey{color:var(--p);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(42px,6vw,76px);letter-spacing:-.06em;line-height:.9;margin:10px 0 15px}h2{font-size:28px;letter-spacing:-.03em}.muted{color:var(--muted);line-height:1.6}.stats,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}.stat,.card{border:1px solid var(--line);padding:22px;background:var(--panel)}.stat strong{font-size:38px;display:block}.card{cursor:pointer;min-height:150px}.card:hover{border-color:var(--p)}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:28px 0 15px}.primary{background:var(--paper);color:#111;border:0;padding:12px 17px;font-weight:800;cursor:pointer}.list{display:grid;gap:9px}.row{border:1px solid var(--line);padding:17px;display:flex;justify-content:space-between;gap:15px;align-items:center}.row b{display:block;margin-bottom:5px}.row small{color:var(--muted)}.empty{border:1px dashed var(--line);padding:35px;text-align:center;color:var(--muted)}dialog{width:min(650px,92vw);border:1px solid var(--line);background:#17140f;color:var(--paper);padding:0}dialog::backdrop{background:#000a}.modal{padding:28px}.modalhead{display:flex;justify-content:space-between;align-items:center}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}input,select,textarea{width:100%;padding:12px;background:#0e0d09;border:1px solid var(--line);color:var(--paper)}textarea{min-height:95px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.toast{position:fixed;right:25px;bottom:25px;background:var(--paper);color:#111;padding:14px 18px;display:none;z-index:10}.bad{color:var(--danger)}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:10px;overflow:auto}.nav{display:flex;min-width:max-content}.nav button{padding:11px}.stats,.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}main{padding-top:30px}.brand span{display:none}}
.assessment-tabs{display:flex;gap:7px;overflow-x:auto;margin:18px 0 22px;padding-bottom:8px}.atab{white-space:nowrap;border:1px solid var(--line);background:#0e0d09;color:var(--muted);padding:10px 12px;cursor:pointer}.atab.active{background:var(--paper);color:#111;border-color:var(--paper)}.astep{display:none}.astep.active{display:block}dialog:has(.assessment-tabs){width:min(820px,94vw);max-height:90vh;overflow:auto}@media(max-width:800px){dialog:has(.assessment-tabs){width:96vw}.assessment-tabs{margin-left:-8px;margin-right:-8px}.atab{font-size:12px}}
.report-actions{display:flex;gap:8px;flex-wrap:wrap}.report-actions button{white-space:nowrap}@media print{header,.shell>aside,.no-print{display:none!important}.shell{display:block}.shell main{padding:0;max-width:none}body{background:#fff;color:#111}}
</style><link rel="stylesheet" href="./responsive.css?v=1"><link rel="stylesheet" href="./lg-design.css?v=1"><script src="./responsive.js?v=1" defer></script><link rel="stylesheet" href="./anamnesis.css?v=2"></head><body data-lg-page="admin"><header><div class="brand"><img class="logo" src="./public/logo-lg.webp"><span>LUAN GUIRON · GESTÃO</span></div><button class="out" id="logout">Sair</button></header><div class="shell"><aside><nav class="nav" id="nav" aria-label="Gestão do professor"></nav></aside><main id="view"><div class="ey">Carregando</div><h1>SEU PAINEL.</h1></main></div><dialog id="modal"><div class="modal"><div class="modalhead"><h2 id="mt">Novo</h2><button class="ghost" onclick="modal.close()">Fechar</button></div><form id="form"></form></div></dialog><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./anamnesis-schema.js?v=2"></script><script src="./anamnesis-pdf.js?v=1"></script><script src="./config.js?v=6"></script><script src="./training-save.js?v=1"></script><script src="./auth-client.js?v=1"></script><script src="./backup-crypto.js?v=1"></script><script src="./backup-ui.js?v=1"></script><script>
const sb=LG_AUTH.createClient(),view=document.querySelector('#view'),nav=document.querySelector('#nav'),modal=document.querySelector('#modal'),form=document.querySelector('#form');let me=null,students=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){let x=document.querySelector('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
async function boot(){try{const {profile:p}=await LG_AUTH.access(sb);me=p;if(p.role!=='trainer')return location.replace('./portal.html');nav.innerHTML=['Dashboard','Alunos','Avaliações','Treinos','Anamneses','Evolução','Orientações','Segurança'].map((x,i)=>'<button data-page="'+x+'" class="'+(!i?'active':'')+'">'+x+'</button>').join('');nav.onclick=e=>{const button=e.target.closest('[data-page]');if(button)go(button.dataset.page)};await go('Dashboard')}catch(error){if(LG_AUTH.sessionExpired(error))return location.replace('./');view.innerHTML='<h2 class="bad">Não foi possível abrir seu painel.</h2><p role="status">'+esc(LG_AUTH.message(error))+'</p><button class="primary" id="retryAccess">Tentar novamente</button>';document.querySelector('#retryAccess').onclick=()=>{view.textContent='Conferindo acesso…';boot()}}}
async function loadStudents(){let {data,error}=await sb.from('profiles').select('*').eq('role','student').order('full_name');if(error)throw error;const notes=await sb.rpc('get_trainer_profile_notes');if(notes.error)throw new Error('Não foi possível carregar as observações privadas. Tente novamente.');const privateNotes=new Map((notes.data||[]).map(n=>[n.profile_id,n.observations]));students=(data||[]).map(s=>({...s,observations:privateNotes.get(s.id)||null}));return students}
function studentOptions(){return students.map(s=>'<option value="'+s.id+'">'+esc(s.full_name)+'</option>').join('')}
async function go(page){if(window.LG_BACKUP_UI)LG_BACKUP_UI.clear();[...nav.children].forEach(b=>b.classList.toggle('active',b.dataset.page===page));view.innerHTML='<div class="ey">'+esc(page)+'</div><h1>CARREGANDO.</h1>';try{if(page==='Segurança')return LG_BACKUP_UI.mount({client:sb,container:view});if(page==='Dashboard')return await dashboard();if(page==='Alunos')return await alunos();if(page==='Avaliações')return await avaliacoes();if(page==='Treinos')return await treinos();if(page==='Anamneses')return await anamneses();if(page==='Evolução')return await evolucao();if(page==='Orientações')return orientacoes()}catch(e){console.error(e);view.innerHTML='<h2 class="bad">Erro ao carregar.</h2><p class="muted">'+esc(e.message)+'</p>'}}
async function dashboard(){await loadStudents();let [ar,sr]=await Promise.all([sb.from('assessments').select('*',{count:'exact',head:true}),sb.from('workout_sessions').select('*',{count:'exact',head:true})]);view.innerHTML='<div class="ey">Seu acompanhamento</div><div class="dashboard-heading"><div><h1>Olá, '+esc(me.full_name.split(' ')[0])+'.</h1><p class="muted">Veja o que precisa de atenção e organize os próximos passos.</p></div><button class="primary" onclick="studentForm()">+ Novo aluno</button></div><div id="dashboardPriorities" aria-live="polite"><p class="muted">Conferindo pendências dos alunos…</p></div><div class="stats"><div class="stat"><strong>'+students.length+'</strong>alunos cadastrados</div><div class="stat"><strong>'+(ar.error?'—':ar.count||0)+'</strong>avaliações registradas</div><div class="stat"><strong>'+(sr.error?'—':sr.count||0)+'</strong>sessões registradas</div></div><h2 class="section-title">Acesso rápido</h2><div class="quick-links">'+['Alunos','Avaliações','Treinos','Anamneses','Evolução','Orientações'].map(x=>'<button class="ghost" onclick="go(\''+x+'\')">'+x+' <span aria-hidden="true">↗</span></button>').join('')+'</div>';if(window.loadDashboardPriorities)window.loadDashboardPriorities(document.querySelector('#dashboardPriorities'));}

async function alunos(){await loadStudents();let {data:ans}=await sb.from('anamneses').select('student_id,submitted_at');let amap=Object.fromEntries((ans||[]).map(a=>[a.student_id,a]));view.innerHTML='<div class="ey">Gestão de alunos</div><h1>ALUNOS.</h1><div class="toolbar"><p class="muted">'+students.length+' cadastro(s)</p><div class="report-actions"><button class="ghost" onclick="navigator.clipboard.writeText(location.origin+location.pathname.replace(/admin\\.html.*/,\'\')+\'cadastro.html\').then(()=>toast(\'Link de cadastro copiado\'))">Copiar link de cadastro</button><button class="primary" onclick="studentForm()">+ Novo aluno</button></div></div><div class="list">'+(students.length?students.map(s=>'<div class="row"><div><b>'+esc(s.full_name)+'</b><small>'+esc(s.email||'Sem e-mail')+' · '+(amap[s.id]?'Anamnese concluída ✓':'Anamnese pendente')+'</small></div><div class="report-actions">'+(amap[s.id]?'<button class="primary" onclick="viewAnamnesis(\''+s.id+'\')">Ver anamnese</button>':'')+'<button class="ghost" onclick="studentForm(\''+s.id+'\')">Editar</button><button class="ghost danger" onclick="deleteStudent(\''+s.id+'\',\''+esc(s.full_name).replace(/'/g,"&#39;")+'\')">Excluir</button></div></div>').join(''):'<div class="empty">Nenhum aluno cadastrado ainda. Você pode cadastrar manualmente ou enviar o link de cadastro.</div>')+'</div>'}
async function viewAnamnesis(studentId){let {data:a,error}=await sb.from('anamneses').select('*').eq('student_id',studentId).order('updated_at',{ascending:false}).limit(1).maybeSingle();if(error)return toast('Não foi possível carregar a anamnese. Tente novamente.');if(!a)return toast('Anamnese ainda não respondida.');let s=students.find(x=>x.id===studentId);document.querySelector('#mt').textContent='Anamnese · '+(s?.full_name||'Aluno');form.innerHTML='<div class="report-actions"><button type="button" class="primary" id="anamModalPdf">Gerar PDF LG</button></div>'+LG_ANAM.report(a,s);document.querySelector('#anamModalPdf').onclick=()=>LG_ANAM_PDF.open(a,s);form.onsubmit=e=>e.preventDefault();modal.showModal()}
function studentForm(id){let s=students.find(x=>x.id===id)||{};document.querySelector('#mt').textContent=id?'Editar aluno':'Novo aluno';form.innerHTML='<div class="form"><div class="field"><label>Nome</label><input name="full_name" value="'+esc(s.full_name)+'" required></div><div class="field"><label>E-mail</label><input name="email" type="email" value="'+esc(s.email)+'" required></div><div class="field"><label>Telefone</label><input name="phone" value="'+esc(s.phone)+'"></div><div class="field"><label>Nascimento</label><input name="birth_date" type="date" value="'+esc(s.birth_date)+'"></div><div class="field"><label>Sexo biológico</label><select name="sex"><option value="">Selecione</option><option value="female" '+(s.sex==='female'?'selected':'')+'>Feminino</option><option value="male" '+(s.sex==='male'?'selected':'')+'>Masculino</option></select></div><div class="field"><label>Início</label><input name="starts_on" type="date" value="'+esc(s.start_date)+'"></div><div class="field"><label>Objetivo</label><input name="goal" value="'+esc(s.goal)+'"></div><div class="field full"><label>Observações privadas do professor</label><textarea name="observations">'+esc(s.observations)+'</textarea></div></div><div class="actions"><button type="button" class="ghost" onclick="modal.close()">Cancelar</button><button class="primary" id="saveStudent">Salvar</button></div>';form.onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#saveStudent');btn.disabled=true;btn.textContent='Salvando...';let v=Object.fromEntries(new FormData(form));Object.keys(v).forEach(k=>v[k]===''&&delete v[k]);try{if(!id){const {data,error}=await sb.functions.invoke('create-student',{body:v});if(error)throw error;if(data?.error)throw new Error(data.error);modal.close();toast('Aluno cadastrado com sucesso');return alunos()}const update={full_name:v.full_name,email:v.email,phone:v.phone||null,birth_date:v.birth_date||null,sex:v.sex||null,start_date:v.starts_on||null,goal:v.goal||null,observations:v.observations||''};let {error}=await sb.from('profiles').update(update).eq('id',id);if(error)throw error;modal.close();toast('Aluno atualizado');alunos()}catch(err){console.error(err);toast('Erro: '+(err.message||'não foi possível salvar'));btn.disabled=false;btn.textContent='Salvar'}};modal.showModal()}
async function deleteStudent(id,name){if(!confirm('Excluir '+name+'?\n\nIsso removerá o acesso e os dados vinculados ao aluno. Esta ação não pode ser desfeita.'))return;try{let {data,error}=await sb.functions.invoke('delete-student',{body:{id}});if(error)throw error;if(data?.error)throw new Error(data.error);toast('Aluno excluído');await alunos()}catch(err){console.error(err);toast('Erro: '+(err.message||'não foi possível excluir'))}}
async function avaliacoes(){await loadStudents();let {data,error}=await sb.from('assessments').select('*').order('assessed_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Avaliação física</div><h1>AVALIAÇÕES.</h1><div class="toolbar"><p class="muted">Avaliação completa: sinais vitais, composição corporal, perimetria, dobras, força e capacidade cardiorrespiratória.</p><button class="primary" onclick="assessmentForm()">+ Nova avaliação</button></div><div class="list">'+((data||[]).map(a=>'<div class="row"><div><b>'+esc(students.find(s=>s.id===a.student_id)?.full_name||'Aluno')+'</b><small>'+esc(a.assessed_at)+' · '+esc(a.protocol||'Avaliação física')+'</small></div><div class="report-actions"><button class="ghost" onclick="assessmentForm(\''+a.id+'\')">Editar avaliação</button><button class="ghost" onclick="assessmentReport(\''+a.id+'\',false)">Visualizar relatório</button><button class="primary" onclick="assessmentReport(\''+a.id+'\',true)">Gerar PDF</button></div></div>').join('')||'<div class="empty">Nenhuma avaliação registrada.</div>')+'</div>'}

async function assessmentReport(id,printNow=false){toast('Montando relatório...');const [ar,cr,sr,str,vr,pr]=await Promise.all([sb.from('assessments').select('*').eq('id',id).single(),sb.from('circumferences').select('*').eq('assessment_id',id).maybeSingle(),sb.from('skinfolds').select('*').eq('assessment_id',id).maybeSingle(),sb.from('strength_tests').select('*').eq('assessment_id',id).order('muscle_group').order('attempt'),sb.from('vo2_tests').select('*').eq('assessment_id',id).maybeSingle(),sb.from('progress_photos').select('*').eq('assessment_id',id).order('view')]);if(ar.error)throw ar.error;let a=ar.data,student=students.find(s=>s.id===a.student_id);if(!student){let {data}=await sb.from('profiles').select('*').eq('id',a.student_id).single();student=data}let stages=[];if(vr.data?.id){let {data}=await sb.from('vo2_stages').select('*').eq('vo2_test_id',vr.data.id).order('stage_number');stages=data||[]}let photos=[];for(const ph of(pr.data||[])){let {data}=await sb.storage.from('progress-photos').createSignedUrl(ph.storage_path,3600);if(data?.signedUrl)photos.push({...ph,url:data.signedUrl})}const val=(x,u='')=>x===null||x===undefined||x===''?'—':esc(x)+u,fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('pt-BR'):'—',age=student?.birth_date&&a.assessed_at?Math.floor((new Date(a.assessed_at+'T12:00:00')-new Date(student.birth_date+'T12:00:00'))/31557600000):null,bmi=a.weight_kg&&a.height_cm?(a.weight_kg/Math.pow(a.height_cm/100,2)).toFixed(1):null;let groups={};for(const x of(str.data||[])){let k=x.set_id||x.muscle_group+'-'+x.side;(groups[k]??=[]).push(x)}let strength=Object.values(groups).map(g=>{let nums=g.map(x=>Number(x.force_kgf)).filter(Number.isFinite);return '<tr><td>'+esc(g[0].muscle_group)+'</td><td>'+esc(g[0].side||'—')+'</td><td>'+g.map(x=>val(x.force_kgf,' kgf')).join(' / ')+'</td><td>'+val(nums.length?(nums.reduce((x,y)=>x+y,0)/nums.length).toFixed(1):null,' kgf')+'</td><td>'+val(nums.length?Math.max(...nums):null,' kgf')+'</td></tr>'}).join('');let circNames={neck:'Pescoço',chest:'Tórax',waist:'Cintura',abdomen:'Abdômen',hip:'Quadril',arm_right:'Braço D',arm_left:'Braço E',forearm_right:'Antebraço D',forearm_left:'Antebraço E',thigh_right:'Coxa D',thigh_left:'Coxa E',calf_right:'Panturrilha D',calf_left:'Panturrilha E'},skinNames={triceps:'Tríceps',subscapular:'Subescapular',biceps:'Bíceps',chest:'Peitoral',midaxillary:'Axilar média',suprailiac:'Supra-ilíaca',abdominal:'Abdominal',thigh:'Coxa',calf:'Panturrilha'},cells=(obj,names,unit)=>obj?Object.entries(names).filter(([k])=>obj[k]!=null).map(([k,n])=>'<div class="metric"><small>'+n+'</small><b>'+val(obj[k],unit)+'</b></div>').join(''):'<p>Sem registro.</p>',photoNames={front:'Frente',back:'Costas',right:'Perfil direito',left:'Perfil esquerdo'};let html='<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Relatório de Avaliação - '+esc(student?.full_name||'Aluno')+'</title><style>@page{size:A4;margin:14mm}*{box-sizing:border-box}body{font:12px Arial,sans-serif;color:#17131c;margin:0}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #7135e8;padding-bottom:12px}.logo{width:62px;height:62px;object-fit:contain}.brand{font-size:20px;font-weight:900}.sub{color:#666}h1{font-size:27px;margin:24px 0 4px}h2{font-size:16px;margin:24px 0 10px;border-bottom:1px solid #ddd;padding-bottom:6px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.metric{border:1px solid #ddd;padding:9px;min-height:50px}.metric small{display:block;color:#666;margin-bottom:5px}.metric b{font-size:13px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px;text-align:left}th{background:#f3f0f6}.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.photos img{width:100%;aspect-ratio:3/4;object-fit:cover}.cap{text-align:center;font-weight:bold;margin-top:4px}.note{background:#f4f2f5;padding:10px}.pagebreak{break-before:page}.no-print{margin:16px 0;padding:10px 14px}@media print{.no-print{display:none}h2{break-after:avoid}.metric,tr,.photos figure{break-inside:avoid}}</style></head><body><button class="no-print" onclick="window.print()">Salvar / imprimir PDF</button><div class="top"><div><div class="brand">LG · LUAN GUIRON</div><div class="sub">Relatório de Avaliação Física</div></div><img class="logo" src="./public/logo-lg.webp"></div><h1>'+esc(student?.full_name||'Aluno')+'</h1><div class="sub">Avaliação: '+fmt(a.assessed_at)+' · Idade: '+val(age)+' · Sexo: '+val(student?.sex==='female'?'Feminino':student?.sex==='male'?'Masculino':null)+'</div><h2>Dados gerais</h2><div class="metrics">'+[['Peso',a.weight_kg,' kg'],['Altura',a.height_cm,' cm'],['IMC',bmi,''],['Pressão arterial',a.systolic_bp&&a.diastolic_bp?a.systolic_bp+'/'+a.diastolic_bp:null,' mmHg'],['FC repouso',a.resting_hr,' bpm'],['SpO₂',a.spo2,' %'],['Temperatura',a.temperature_c,' °C']].map(x=>'<div class="metric"><small>'+x[0]+'</small><b>'+val(x[1],x[2])+'</b></div>').join('')+'</div><h2>Composição corporal</h2><div class="metrics">'+[['Método',a.composition_method==='skinfolds'?'Dobras cutâneas':a.composition_method==='bioimpedance'?'Bioimpedância':null,''],['Protocolo',a.protocol,''],['Densidade corporal',a.body_density,''],['Gordura corporal',a.body_fat_pct,' %'],['Massa gorda',a.fat_mass_kg,' kg'],['Massa magra',a.lean_mass_kg,' kg']].map(x=>'<div class="metric"><small>'+x[0]+'</small><b>'+val(x[1],x[2])+'</b></div>').join('')+'</div>'+(sr.data?'<h2>Dobras cutâneas</h2><div class="metrics">'+cells(sr.data,skinNames,' mm')+'</div>':'')+'<h2>Perimetria</h2><div class="metrics">'+cells(cr.data,circNames,' cm')+'</div><h2>Força — dinamometria</h2>'+(strength?'<table><thead><tr><th>Teste</th><th>Lado</th><th>Tentativas</th><th>Média</th><th>Melhor</th></tr></thead><tbody>'+strength+'</tbody></table>':'<p>Sem testes registrados.</p>')+'<h2>Capacidade cardiorrespiratória</h2>'+(vr.data?'<div class="metrics"><div class="metric"><small>Protocolo</small><b>'+val(vr.data.protocol)+'</b></div>< async function treinos(){await loadStudents();let {data,error}=await sb.from('training_plans').select('*').order('created_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Prescrição</div><h1>TREINOS.</h1><div class="toolbar"><p class="muted">Monte e organize as fichas de treino dos seus alunos.</p><button class="primary" onclick="planForm()">+ Novo plano</button></div><div class="list">'+((data||[]).map(x=>'<div class="row"><div><b>'+esc(x.name)+'</b><small>'+esc(students.find(s=>s.id===x.student_id)?.full_name||'Aluno')+' · '+(x.starts_on?new Date(x.starts_on+'T12:00:00').toLocaleDateString('pt-BR'):'Sem data')+'</small></div><button class="primary" onclick="openTrainingPlan(\''+x.id+'\')">Abrir treinos</button></div>').join('')||'<div class="empty">Nenhum plano de treino cadastrado.</div>')+'</div>'}

function planForm(){if(!students.length)return toast('Cadastre um aluno primeiro');document.querySelector('#mt').textContent='Novo plano de treino';form.innerHTML='<div class="form"><div class="field full"><label>Aluno</label><select name="student_id">'+studentOptions()+'</select></div><div class="field full"><label>Nome do plano</label><input name="name" placeholder="Ex.: Hipertrofia — Setembro" required></div><div class="field"><label>Quantidade de treinos</label><select name="workout_count"><option value="1">1 — Treino A</option><option value="2">2 — A / B</option><option value="3" selected>3 — A / B / C</option><option value="4">4 — A / B / C / D</option><option value="5">5 — A / B / C / D / E</option></select></div><div class="field"><label>Objetivo</label><input name="goal" placeholder="Ex.: Hipertrofia"></div><div class="field"><label>Início</label><input name="starts_on" type="date"></div><div class="field"><label>Fim</label><input name="ends_on" type="date"></div><div class="field full"><label>Observações do plano</label><textarea name="notes"></textarea></div></div><div class="actions"><button type="button" class="ghost" onclick="modal.close()">Cancelar</button><button type="submit" class="primary" id="createPlan">Criar plano</button></div>';LG_TRAINING.bindForm(form,form.querySelector('#createPlan'),v=>LG_PLANS.create(v),async id=>{toast('Plano criado com todos os treinos');await openTrainingPlan(id)},'Criando...');modal.showModal()}

async function openTrainingPlan(planId){let [{data:p,error:pe},{data:ws,error:we}]=await Promise.all([sb.from('training_plans').select('*').eq('id',planId).single(),sb.from('workouts').select('*').eq('plan_id',planId).order('position')]);if(pe||we)return toast((pe||we).message);let student=students.find(s=>s.id===p.student_id);view.innerHTML='<div class="ey">Treinos / '+esc(student?.full_name||'Aluno')+'</div><h1>'+esc(p.name).toUpperCase()+'.</h1><div class="toolbar"><p class="muted">'+esc(p.goal||'Plano de treino')+'</p><button class="ghost" onclick="treinos()">← Voltar aos planos</button></div><div class="assessment-tabs" id="workoutTabs">'+ws.map((w,i)=>'<button class="atab '+(!i?'active':'')+'" data-workout="'+w.id+'">'+esc(w.name)+'</button>').join('')+'</div><div id="workoutEditor" data-plan-id="'+p.id+'"></div>';let tabs=[...document.querySelectorAll('#workoutTabs .atab')];tabs.forEach(b=>b.onclick=()=>{tabs.forEach(x=>x.classList.remove('active'));b.classList.add('active');renderWorkout(b.dataset.workout)});if(ws.length)renderWorkout(ws[0].id)}

async function renderWorkout(workoutId){let box=document.querySelector('#workoutEditor');if(!box)return;box.dataset.workoutId=workoutId;box.innerHTML='<div class="empty">Carregando treino...</div>';let [{data:w,error:we},{data:ex,error:ee}]=await Promise.all([sb.from('workouts').select('*').eq('id',workoutId).single(),sb.from('workout_exercises').select('*').eq('workout_id',workoutId).order('position')]);if(box.dataset.workoutId!==workoutId||document.querySelector('#workoutEditor')!==box)return;if(we||ee){box.innerHTML='<div class="empty">'+esc((we||ee).message)+'</div>';return}box.innerHTML='<div class="toolbar"><div><h2 style="margin:0">'+esc(w.name)+'</h2><p class="muted">'+esc(w.notes||'Adicione os exercícios deste treino.')+'</p></div><div class="report-actions"><button type="button" class="ghost" data-rename-workout>Renomear</button><button class="primary" onclick="exerciseForm(\''+w.id+'\','+(ex.length+1)+')">+ Adicionar exercício</button></div></div><div class="list">'+(ex.length?ex.map((x,i)=>'<div class="row"><div style="min-width:0"><b>'+(i+1)+'. '+esc(x.exercise_name)+'</b><small>'+(x.target_sets?esc(x.target_sets)+' séries':'Séries livres')+(x.rep_min||x.rep_max?' · '+esc(x.rep_min||'')+(x.rep_max&&x.rep_max!=x.rep_min?'–'+esc(x.rep_max):'')+' reps':'')+(x.target_rir!=null?' · RIR '+esc(x.target_rir):'')+(x.rest_seconds?' · '+esc(x.rest_seconds)+' s descanso':'')+'</small>'+(x.execution_notes?'<p class="muted" style="margin:7px 0 0"><b>Execução:</b> '+esc(x.execution_notes)+'</p>':'')+(x.notes?'<p class="muted" style="margin:4px 0 0"><b>Observação:</b> '+esc(x.notes)+'</p>':'')+'</div><div class="report-actions"><button class="ghost" onclick="exerciseForm(\''+w.id+'\','+x.position+',\''+x.id+'\')">Editar</button><button class="ghost" onclick="deleteExercise(\''+x.id+'\',\''+w.id+'\')">Excluir</button></div></div>').join(''):'<div class="empty">Nenhum exercício ainda. Clique em “Adicionar exercício” para começar.</div>')+'</div>';box.querySelector('[data-rename-workout]').onclick=()=>renameWorkout(w.id,w.name)}

const pendingWorkoutChanges=new Set();
async function renameWorkout(id,current){if(pendingWorkoutChanges.has(id))return;let name=prompt('Nome deste treino:',current);if(!name?.trim())return;pendingWorkoutChanges.add(id);try{const saved=await LG_TRAINING.renameWorkout(id,name);toast('Treino renomeado');let active=document.querySelector('#workoutTabs .atab.active');if(active?.dataset.workout===id){active.textContent=saved.name;await renderWorkout(id)}}catch(error){toast(LG_TRAINING.message(error))}finally{pendingWorkoutChanges.delete(id)}}

async function exerciseForm(workoutId,position,exerciseId=null){let x={};if(exerciseId){let {data,error}=await sb.from('workout_exercises').select('*').eq('id',exerciseId).single();if(error)return toast(error.message);x=data}document.querySelector('#mt').textContent=exerciseId?'Editar exercício':'Adicionar exercício';form.innerHTML='<div class="form"><div class="field full"><label>Nome do exercício</label><input name="exercise_name" value="'+esc(x.exercise_name||'')+'" placeholder="Ex.: Supino inclinado com halteres" required></div><div class="field"><label>Séries</label><input name="target_sets" type="number" min="1" max="20" value="'+esc(x.target_sets||'')+'" placeholder="3"></div><div class="field"><label>Repetições mínimas</label><input name="rep_min" type="number" min="1" max="200" value="'+esc(x.rep_min||'')+'" placeholder="8"></div><div class="field"><label>Repetições máximas</label><input name="rep_max" type="number" min="1" max="200" value="'+esc(x.rep_max||'')+'" placeholder="12"></div><div class="field"><label>RIR alvo</label><input name="target_rir" type="number" min="0" max="10" step=".5" value="'+esc(x.target_rir??'')+'" placeholder="2"></div><div class="field"><label>Descanso (segundos)</label><input name="rest_seconds" type="number" min="0" max="1800" value="'+esc(x.rest_seconds??'')+'" placeholder="90"></div><div class="field full"><label>Como executar</label><textarea name="execution_notes" placeholder="Ex.: mantenha as escápulas apoiadas, desça de forma controlada...">'+esc(x.execution_notes||'')+'</textarea></div><div class="field full"><label>Observações</label><textarea name="notes" placeholder="Ex.: banco na posição 4; interromper se houver desconforto...">'+esc(x.notes||'')+'</textarea></div></div><div class="actions"><button type="button" class="ghost" onclick="modal.close()">Cancelar</button><button type="submit" class="primary">'+(exerciseId?'Salvar alterações':'Adicionar exercício')+'</button></div>';LG_TRAINING.bindForm(form,form.querySelector('button[type="submit"]'),v=>LG_TRAINING.saveExercise(v,workoutId,position,exerciseId),async()=>{toast(exerciseId?'Exercício atualizado':'Exercício adicionado');await renderWorkout(workoutId)});modal.showModal()}

const pendingExerciseDeletes=new Set();
async function deleteExercise(id,workoutId){if(pendingExerciseDeletes.has(id)||!confirm('Excluir este exercício do treino?'))return;pendingExerciseDeletes.add(id);try{await LG_TRAINING.removeExercise(id,workoutId);toast('Exercício excluído');await renderWorkout(workoutId)}catch(error){toast(LG_TRAINING.message(error))}finally{pendingExerciseDeletes.delete(id)}}

async function anamneses(){await loadStudents();let {data,error}=await sb.from('anamneses').select('id,student_id,submitted_at,updated_at').order('updated_at',{ascending:false});if(error)throw error;const seen=new Set(),rows=(data||[]).filter(a=>{if(seen.has(a.student_id))return false;seen.add(a.student_id);return true});view.innerHTML='<div class="ey">Acompanhamento</div><h1>ANAMNESES.</h1><p class="muted">Veja a última anamnese respondida de cada aluno. Abra o relatório para conferir as respostas e gerar o PDF LG.</p><div class="list">'+(rows.map(a=>{const student=students.find(s=>s.id===a.student_id),date=a.updated_at||a.submitted_at;return '<div class="row"><div><b>'+esc(student?.full_name||'Aluno')+'</b><small>Última atualização: '+esc(date?new Date(date).toLocaleString('pt-BR'):'Não informado')+'</small></div><div class="report-actions"><button type="button" class="primary" data-anam-student="'+esc(a.student_id)+'">Ver anamnese</button></div></div>'}).join('')||'<div class="empty">Nenhuma anamnese respondida ainda.</div>')+'</div>';view.querySelectorAll('[data-anam-student]').forEach(button=>button.onclick=()=>viewAnamnesis(button.dataset.anamStudent))}
async function evolucao(){await loadStudents();view.innerHTML='<div class="ey">Acompanhamento visual</div><h1>EVOLUÇÃO.</h1><p class="muted">Selecione um aluno para visualizar e comparar as fotos privadas de evolução.</p><div class="toolbar"><select id="evoStudent"><option value="">Selecione o aluno</option>'+students.map(s=>'<option value="'+s.id+'">'+esc(s.full_name)+'</option>').join('')+'</select></div><div id="evoPhotos" class="list"><div class="empty">Escolha um aluno.</div></div>';document.querySelector('#evoStudent').onchange=async e=>{let box=document.querySelector('#evoPhotos'),sid=e.target.value;if(!sid){box.innerHTML='<div class="empty">Escolha um aluno.</div>';return}box.innerHTML='<div class="empty">Carregando...</div>';let {data,error}=await sb.from('progress_photos').select('*').eq('student_id',sid).order('photo_date',{ascending:false});if(error){box.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}if(!data?.length){box.innerHTML='<div class="empty">Nenhuma foto cadastrada para este aluno.</div>';return}let groups={};for(const ph of data){let {data:sg}=await sb.storage.from('progress-photos').createSignedUrl(ph.storage_path,3600);if(!groups[ph.photo_date])groups[ph.photo_date]=[];groups[ph.photo_date].push({...ph,url:sg?.signedUrl})}let dates=Object.keys(groups).sort((a,b)=>b.localeCompare(a)),names={front:'Frente',back:'Costas',right:'Perfil direito',left:'Perfil esquerdo'},opts=dates.map(d=>'<option value="'+d+'">'+new Date(d+'T12:00:00').toLocaleDateString('pt-BR')+'</option>').join('');box.innerHTML=(dates.length>1?'<div class="empty"><b>Comparador antes × depois</b><div class="form" style="margin-top:12px"><div class="field"><label>Antes</label><select id="admCmpA">'+opts+'</select></div><div class="field"><label>Depois</label><select id="admCmpB">'+opts+'</select></div><div class="field"><label>Ângulo</label><select id="admCmpV"><option value="front">Frente</option><option value="back">Costas</option><option value="right">Perfil direito</option><option value="left">Perfil esquerdo</option></select></div></div><div id="admCmpR"></div></div>':'')+dates.map(d=>'<div class="row"><div><b>'+new Date(d+'T12:00:00').toLocaleDateString('pt-BR')+'</b><small>'+groups[d].map(x=>names[x.view]||x.view).join(' · ')+'</small></div></div>').join('');if(dates.length>1){let a=document.querySelector('#admCmpA'),b=document.querySelector('#admCmpB'),v=document.querySelector('#admCmpV');a.value=dates[dates.length-1];b.value=dates[0];let draw=()=>{let pa=groups[a.value]?.find(x=>x.view===v.value),pb=groups[b.value]?.find(x=>x.view===v.value),r=document.querySelector('#admCmpR');r.innerHTML=pa&&pb?'<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px"><div><img src="'+pa.url+'" style="width:100%;aspect-ratio:3/4;object-fit:cover"><b>ANTES · '+new Date(a.value+'T12:00:00').toLocaleDateString('pt-BR')+'</b></div><div><img src="'+pb.url+'" style="width:100%;aspect-ratio:3/4;object-fit:cover"><b>DEPOIS · '+new Date(b.value+'T12:00:00').toLocaleDateString('pt-BR')+'</b></div></div>':'<div class="empty">Ângulo indisponível nas duas avaliações.</div>'};a.onchange=b.onchange=v.onchange=draw;draw()}}}
async function orientacoes(){await loadStudents();let {data,error}=await sb.from('guidance').select('*').order('created_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Recomendações</div><h1>ORIENTAÇÕES.</h1><div class="toolbar"><p class="muted">Orientações individuais registradas no histórico.</p><button class="primary" onclick="guideForm()">+ Nova orientação</button></div><div class="list">'+((data||[]).map(x=>'<div class="row"><div><b>'+esc(x.title||'Orientação')+'</b><small>'+esc(students.find(s=>s.id===x.student_id)?.full_name||'Aluno')+'</small></div></div>').join('')||'<div class="empty">Nenhuma orientação registrada.</div>')+'</div>'}
function guideForm(){if(!students.length)return toast('Cadastre um aluno primeiro');document.querySelector('#mt').textContent='Nova orientação';form.innerHTML='<div class="form"><div class="field full"><label>Aluno</label><select name="student_id">'+studentOptions()+'</select></div><div class="field full"><label>Título</label><input name="title" required></div><div class="field full"><label>Orientação</label><textarea name="body" required></textarea></div></div><div class="actions"><button class="primary">Salvar</button></div>';form.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(form));v.created_by=me.id;let {error}=await sb.from('guidance').insert(v);if(error)return toast(error.message);modal.close();toast('Orientação salva');orientacoes()};modal.showModal()}
document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();location.href='./'};boot();
</script></body></html>
