<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LG Gestão</title><style>
:root{--bg:#12100b;--panel:#18150f;--paper:#f0ede7;--muted:#a9a49c;--line:#39352d;--p:#c784ff;--danger:#ff8b8b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:15px Arial,sans-serif}button,input,select,textarea{font:inherit}header{height:82px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 4vw;position:sticky;top:0;background:rgba(18,16,11,.96);z-index:5}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.logo{width:44px;height:44px;border-radius:50%;background:#fff;padding:4px;object-fit:contain}.out,.ghost{background:none;color:var(--paper);border:1px solid var(--line);padding:10px 15px;cursor:pointer}.shell{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 82px)}aside{border-right:1px solid var(--line);padding:30px 18px}.nav{display:grid;gap:7px}.nav button{border:0;background:none;color:var(--muted);text-align:left;padding:13px;border-radius:8px;font-weight:700;cursor:pointer}.nav button.active,.nav button:hover{background:#211c16;color:var(--paper)}main{padding:42px 4vw 80px;max-width:1400px}.ey{color:var(--p);font-size:12px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(42px,6vw,76px);letter-spacing:-.06em;line-height:.9;margin:10px 0 15px}h2{font-size:28px;letter-spacing:-.03em}.muted{color:var(--muted);line-height:1.6}.stats,.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px}.stat,.card{border:1px solid var(--line);padding:22px;background:var(--panel)}.stat strong{font-size:38px;display:block}.card{cursor:pointer;min-height:150px}.card:hover{border-color:var(--p)}.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin:28px 0 15px}.primary{background:var(--paper);color:#111;border:0;padding:12px 17px;font-weight:800;cursor:pointer}.list{display:grid;gap:9px}.row{border:1px solid var(--line);padding:17px;display:flex;justify-content:space-between;gap:15px;align-items:center}.row b{display:block;margin-bottom:5px}.row small{color:var(--muted)}.empty{border:1px dashed var(--line);padding:35px;text-align:center;color:var(--muted)}dialog{width:min(650px,92vw);border:1px solid var(--line);background:#17140f;color:var(--paper);padding:0}dialog::backdrop{background:#000a}.modal{padding:28px}.modalhead{display:flex;justify-content:space-between;align-items:center}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field.full{grid-column:1/-1}.field label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}input,select,textarea{width:100%;padding:12px;background:#0e0d09;border:1px solid var(--line);color:var(--paper)}textarea{min-height:95px}.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.toast{position:fixed;right:25px;bottom:25px;background:var(--paper);color:#111;padding:14px 18px;display:none;z-index:10}.bad{color:var(--danger)}@media(max-width:800px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:10px;overflow:auto}.nav{display:flex;min-width:max-content}.nav button{padding:11px}.stats,.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}main{padding-top:30px}.brand span{display:none}}
</style></head><body><header><div class="brand"><img class="logo" src="./public/logo-lg.webp"><span>LUAN GUIRON · GESTÃO</span></div><button class="out" id="logout">Sair</button></header><div class="shell"><aside><nav class="nav" id="nav"></nav></aside><main id="view"><div class="ey">Carregando</div><h1>SEU PAINEL.</h1></main></div><dialog id="modal"><div class="modal"><div class="modalhead"><h2 id="mt">Novo</h2><button class="ghost" onclick="modal.close()">Fechar</button></div><form id="form"></form></div></dialog><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>
const sb=supabase.createClient(LG_CONFIG.supabaseUrl,LG_CONFIG.supabaseKey),view=document.querySelector('#view'),nav=document.querySelector('#nav'),modal=document.querySelector('#modal'),form=document.querySelector('#form');let me=null,students=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){let x=document.querySelector('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',2600)}
async function boot(){const {data:{session}}=await sb.auth.getSession();if(!session)return location.href='./';let {data:p,error}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();if(error||!p)return view.innerHTML='<h2 class="bad">Não foi possível carregar seu perfil.</h2>';me=p;if(p.role!=='trainer')return location.href='./portal.html';nav.innerHTML=['Dashboard','Alunos','Avaliações','Treinos','Anamneses','Evolução','Orientações'].map((x,i)=>'<button data-page="'+x+'" class="'+(!i?'active':'')+'">'+x+'</button>').join('');nav.onclick=e=>{if(e.target.dataset.page)go(e.target.dataset.page)};go('Dashboard')}
async function loadStudents(){let {data,error}=await sb.from('profiles').select('*').eq('role','student').order('full_name');if(error)throw error;students=data||[];return students}
function studentOptions(){return students.map(s=>'<option value="'+s.id+'">'+esc(s.full_name)+' · '+esc(s.email||'')+'</option>').join('')}
async function go(page){[...nav.children].forEach(b=>b.classList.toggle('active',b.dataset.page===page));view.innerHTML='<div class="ey">'+esc(page)+'</div><h1>CARREGANDO.</h1>';try{if(page==='Dashboard')return dashboard();if(page==='Alunos')return alunos();if(page==='Avaliações')return avaliacoes();if(page==='Treinos')return treinos();if(page==='Anamneses')return generic('Anamneses','anamneses','answers');if(page==='Evolução')return evolucao();if(page==='Orientações')return orientacoes()}catch(e){console.error(e);view.innerHTML='<h2 class="bad">Erro ao carregar.</h2><p class="muted">'+esc(e.message)+'</p>'}}
async function dashboard(){await loadStudents();let [{count:a},{count:w},{count:s}]=await Promise.all([sb.from('assessments').select('*',{count:'exact',head:true}),sb.from('training_plans').select('*',{count:'exact',head:true}),sb.from('workout_sessions').select('*',{count:'exact',head:true})]);view.innerHTML='<div class="ey">Professor / Administração</div><h1>OLÁ,<br>'+esc(me.full_name.split(' ')[0].toUpperCase())+'.</h1><p class="muted">Gestão central dos seus alunos, avaliações e prescrições.</p><div class="stats"><div class="stat"><strong>'+students.length+'</strong>alunos cadastrados</div><div class="stat"><strong>'+(a||0)+'</strong>avaliações</div><div class="stat"><strong>'+(s||0)+'</strong>sessões registradas</div></div><div class="cards">'+['Alunos','Avaliações','Treinos','Anamneses','Evolução','Orientações'].map(x=>'<div class="card" onclick="go(\''+x+'\')"><h2>'+x+'</h2><p class="muted">Abrir módulo →</p></div>').join('')+'</div>'}
async function alunos(){await loadStudents();view.innerHTML='<div class="ey">Gestão de alunos</div><h1>ALUNOS.</h1><div class="toolbar"><p class="muted">'+students.length+' cadastro(s)</p><button class="primary" onclick="studentForm()">+ Novo aluno</button></div><div class="list">'+(students.length?students.map(s=>'<div class="row"><div><b>'+esc(s.full_name)+'</b><small>'+esc(s.email||'Sem e-mail')+' · '+esc(s.goal||'Objetivo não informado')+'</small></div><button class="ghost" onclick="studentForm(\''+s.id+'\')">Editar</button></div>').join(''):'<div class="empty">Nenhum aluno cadastrado ainda.</div>')+'</div>'}
function studentForm(id){let s=students.find(x=>x.id===id)||{};document.querySelector('#mt').textContent=id?'Editar aluno':'Novo aluno';form.innerHTML='<div class="form"><div class="field"><label>Nome</label><input name="full_name" value="'+esc(s.full_name)+'" required></div><div class="field"><label>E-mail</label><input name="email" type="email" value="'+esc(s.email)+'" required></div><div class="field"><label>Telefone</label><input name="phone" value="'+esc(s.phone)+'"></div><div class="field"><label>Nascimento</label><input name="birth_date" type="date" value="'+esc(s.birth_date)+'"></div><div class="field"><label>Início</label><input name="starts_on" type="date" value="'+esc(s.start_date)+'"></div><div class="field"><label>Objetivo</label><input name="goal" value="'+esc(s.goal)+'"></div><div class="field full"><label>Observações</label><textarea name="observations">'+esc(s.observations)+'</textarea></div></div><div class="actions"><button type="button" class="ghost" onclick="modal.close()">Cancelar</button><button class="primary" id="saveStudent">Salvar</button></div>';form.onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#saveStudent');btn.disabled=true;btn.textContent='Salvando...';let v=Object.fromEntries(new FormData(form));Object.keys(v).forEach(k=>v[k]===''&&delete v[k]);try{if(!id){const {data,error}=await sb.functions.invoke('create-student',{body:v});if(error)throw error;if(data?.error)throw new Error(data.error);modal.close();toast('Aluno cadastrado com sucesso');return alunos()}const update={full_name:v.full_name,email:v.email,phone:v.phone||null,birth_date:v.birth_date||null,start_date:v.starts_on||null,goal:v.goal||null,observations:v.observations||null};let {error}=await sb.from('profiles').update(update).eq('id',id);if(error)throw error;modal.close();toast('Aluno atualizado');alunos()}catch(err){console.error(err);toast('Erro: '+(err.message||'não foi possível salvar'));btn.disabled=false;btn.textContent='Salvar'}};modal.showModal()}
async function avaliacoes(){await loadStudents();let {data,error}=await sb.from('assessments').select('*').order('assessed_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Avaliação física</div><h1>AVALIAÇÕES.</h1><div class="toolbar"><p class="muted">Registre sinais vitais, composição corporal e protocolo.</p><button class="primary" onclick="assessmentForm()">+ Nova avaliação</button></div><div class="list">'+((data||[]).map(a=>'<div class="row"><div><b>'+esc(students.find(s=>s.id===a.student_id)?.full_name||'Aluno')+'</b><small>'+esc(a.assessed_at)+' · '+esc(a.protocol||'Sem protocolo')+'</small></div></div>').join('')||'<div class="empty">Nenhuma avaliação registrada.</div>')+'</div>'}
function assessmentForm(){if(!students.length)return toast('Cadastre um aluno primeiro');document.querySelector('#mt').textContent='Nova avaliação';form.innerHTML='<div class="form"><div class="field full"><label>Aluno</label><select name="student_id">'+studentOptions()+'</select></div><div class="field"><label>Data</label><input name="assessed_at" type="date" required></div><div class="field"><label>Peso (kg)</label><input name="weight_kg" type="number" step=".01"></div><div class="field"><label>Altura (cm)</label><input name="height_cm" type="number" step=".1"></div><div class="field"><label>% gordura</label><input name="body_fat_pct" type="number" step=".01"></div><div class="field"><label>Pressão sistólica</label><input name="systolic_bp" type="number"></div><div class="field"><label>Pressão diastólica</label><input name="diastolic_bp" type="number"></div><div class="field"><label>SpO₂ (%)</label><input name="spo2" type="number"></div><div class="field"><label>FC repouso</label><input name="resting_hr" type="number"></div><div class="field full"><label>Protocolo</label><input name="protocol"></div><div class="field full"><label>Observações</label><textarea name="notes"></textarea></div></div><div class="actions"><button class="primary">Salvar avaliação</button></div>';form.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(form));Object.keys(v).forEach(k=>v[k]===''&&delete v[k]);v.created_by=me.id;let {error}=await sb.from('assessments').insert(v);if(error)return toast(error.message);modal.close();toast('Avaliação salva');avaliacoes()};modal.showModal()}
async function treinos(){await loadStudents();let {data,error}=await sb.from('training_plans').select('*').order('created_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Prescrição</div><h1>TREINOS.</h1><div class="toolbar"><p class="muted">Planos individualizados por aluno.</p><button class="primary" onclick="planForm()">+ Novo plano</button></div><div class="list">'+((data||[]).map(x=>'<div class="row"><div><b>'+esc(x.name)+'</b><small>'+esc(students.find(s=>s.id===x.student_id)?.full_name||'Aluno')+'</small></div></div>').join('')||'<div class="empty">Nenhum plano de treino cadastrado.</div>')+'</div>'}
function planForm(){if(!students.length)return toast('Cadastre um aluno primeiro');document.querySelector('#mt').textContent='Novo plano';form.innerHTML='<div class="form"><div class="field full"><label>Aluno</label><select name="student_id">'+studentOptions()+'</select></div><div class="field full"><label>Nome do plano</label><input name="name" placeholder="Ex.: Hipertrofia ABC" required></div><div class="field"><label>Início</label><input name="starts_on" type="date"></div><div class="field"><label>Fim</label><input name="ends_on" type="date"></div><div class="field full"><label>Observações</label><textarea name="notes"></textarea></div></div><div class="actions"><button class="primary">Criar plano</button></div>';form.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(form));Object.keys(v).forEach(k=>v[k]===''&&delete v[k]);v.created_by=me.id;let {error}=await sb.from('training_plans').insert(v);if(error)return toast(error.message);modal.close();toast('Plano criado');treinos()};modal.showModal()}
async function generic(title,table){await loadStudents();let {data,error}=await sb.from(table).select('*').order('created_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Acompanhamento</div><h1>'+title.toUpperCase()+'.</h1><p class="muted">Histórico centralizado dos seus alunos.</p><div class="list">'+((data||[]).map(x=>'<div class="row"><div><b>'+esc(students.find(s=>s.id===x.student_id)?.full_name||'Aluno')+'</b><small>'+esc(x.submitted_at||x.updated_at||'')+'</small></div></div>').join('')||'<div class="empty">Nenhum registro ainda.</div>')+'</div>'}
async function evolucao(){await loadStudents();let {data,error}=await sb.from('progress_photos').select('*').order('taken_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Acompanhamento visual</div><h1>EVOLUÇÃO.</h1><p class="muted">Fotos e registros permanecem privados e vinculados a cada aluno.</p><div class="list">'+((data||[]).map(x=>'<div class="row"><div><b>'+esc(students.find(s=>s.id===x.student_id)?.full_name||'Aluno')+'</b><small>'+esc(x.photo_date||'')+'</small></div></div>').join('')||'<div class="empty">Nenhuma foto de evolução registrada.</div>')+'</div>'}
async function orientacoes(){await loadStudents();let {data,error}=await sb.from('guidance').select('*').order('created_at',{ascending:false});if(error)throw error;view.innerHTML='<div class="ey">Recomendações</div><h1>ORIENTAÇÕES.</h1><div class="toolbar"><p class="muted">Orientações individuais registradas no histórico.</p><button class="primary" onclick="guideForm()">+ Nova orientação</button></div><div class="list">'+((data||[]).map(x=>'<div class="row"><div><b>'+esc(x.title||'Orientação')+'</b><small>'+esc(students.find(s=>s.id===x.student_id)?.full_name||'Aluno')+'</small></div></div>').join('')||'<div class="empty">Nenhuma orientação registrada.</div>')+'</div>'}
function guideForm(){if(!students.length)return toast('Cadastre um aluno primeiro');document.querySelector('#mt').textContent='Nova orientação';form.innerHTML='<div class="form"><div class="field full"><label>Aluno</label><select name="student_id">'+studentOptions()+'</select></div><div class="field full"><label>Título</label><input name="title" required></div><div class="field full"><label>Orientação</label><textarea name="body" required></textarea></div></div><div class="actions"><button class="primary">Salvar</button></div>';form.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(form));v.created_by=me.id;let {error}=await sb.from('guidance').insert(v);if(error)return toast(error.message);modal.close();toast('Orientação salva');orientacoes()};modal.showModal()}
document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();location.href='./'};boot();
</script></body></html>
